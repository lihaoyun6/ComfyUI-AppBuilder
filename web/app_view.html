            galleryData.forEach(src => { renderGalleryItem(src, false); });
            
            document.getElementById('btn-clear-gallery').onclick = (e) => {
                e.stopPropagation();
                const confirmText = t("confirm_clear_gallery", "Clear generation history?");
                if (confirm(confirmText)) {
                    const galleryScroll = document.getElementById('gallery-scroll');
                    if (galleryScroll) galleryScroll.innerHTML = ''; // 👈 一键彻底清空图片、视频及 ▶ 播放按钮
                    galleryData = []; localStorage.removeItem('appview_gallery_history');
                }
            };
            
            // 🌟【分流判断】：无头独立模式 VS 画布模式
            if (isStandaloneMode) {
                try {
                    // 从后端下载工作流配置文件
                    await fetchObjectInfo();
                    setTimeout(() => { if (splash) splash.classList.add('fade-out'); }, 400);
                    const res = await fetch(`/appbuilder/workflows/get?file=${encodeURIComponent(appFileName)}`);
                    if (res.ok) {
                        standaloneWorkflowData = await res.json();
                        standaloneBuilderNode = standaloneWorkflowData.nodes.find(n => n.type === "AppBuilderAdv" || n.type === "AppBuilder");
                        
                        if (!standaloneBuilderNode) {
                            alert(t("not_app", "⚠️ Invalid App Workflow\n\nThis is not an App workflow!\nPlease configure it using AppBuilder first."));
                            window.location.href = `apps?mode=standalone`;
                            return;
                        }
                        
                        let hasSubgraph = false;
                        let hasBypasser = false;
                        
                        // 1. 嗅探子图：检查工作流中是否包含 UUID 类型的节点 (Group Node V2)
                        const uuidRegex = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
                        if (standaloneWorkflowData.nodes) {
                            for (const node of standaloneWorkflowData.nodes) {
                                if (uuidRegex.test(node.type)) {
                                    hasSubgraph = true; break;
                                }
                            }
                        }
                        
                        // 2. 嗅探 Bypasser：检查 AppBuilder 配置中是否使用了 Bypasser 组件
                        if (standaloneBuilderNode) {
                            const jsonStr = standaloneBuilderNode.widgets_values?.[0] || "{}";
                            try {
                                const config = JSON.parse(jsonStr);
                                for (const key in config) {
                                    if (config[key].type === "BYPASSER") {
                                        hasBypasser = true; break;
                                    }
                                }
                            } catch(e) {}
                        }
                        
                        // 如果命中其中一项，直接弹窗警告，并禁用 Run 按钮
                        if (hasSubgraph || hasBypasser) {
                            alert(t("no_subgraph_alert", "⚠️ Warning\n\nYou cannot use subgraphs or bypassers in standalone mode; please use this workflow in canvas mode."));
                            window.location.href = `apps?mode=standalone`;
                        }
                        
                        if (standaloneBuilderNode) {
                            const jsonStr = standaloneBuilderNode.widgets_values?.[0] || "{}";
                            renderDynamicForm(JSON.parse(jsonStr));
                        }
                    }
                } catch(e) { console.error("Load standalone app failed:", e); }
                
                initResizeLogic();
                initLogResizeLogic();
                handleResponsiveLayout(true); 
                window.addEventListener('resize', () => handleResponsiveLayout(false));
                initLightboxEvents();
                initStandaloneWebSocket();
                
                restoreLogHistory(); // 恢复历史运行日志
                return; // 无头模式初始化完成
            }

            // 下面保持你原有的在画布中打开的 (nodeId && parentWindow) 逻辑不变...
            if (nodeId && parentWindow) {
                const parentApp = parentWindow.comfyApp;
                const parentApi = parentWindow.comfyApi;
                window.comfyApp = parentApp;
                window.comfyApi = parentApi;
                
                const refreshBtn = document.getElementById('refresh-btn');
                refreshBtn.style.display = "flex";
                refreshBtn.onclick = async (e) => {
                    if (splash) {
                        splash.classList.remove('fade-out');
                        const titleEl = splash.querySelector('.splash-title');
                        const iconEl = splash.querySelector('.splash-icon');
                        iconEl.classList.add("loading");
                        iconEl.innerText = "⏳";
                        titleEl.innerText = t("refreshing", "Loading Nodes & Models");
                    }
                    
                    try {
                        if (window.comfyApp && typeof window.comfyApp.refreshComboInNodes === "function") {
                            await window.comfyApp.refreshComboInNodes();
                        }
                    } catch (err) {
                        console.warn("Refresh failed:", err);
                    }
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    location.reload(); 
                };
                
                const parentNode = parentApp.graph.getNodeById(nodeId);
                if (parentNode) {
                    sourceNodeId = nodeId;
                    if (parentNode.registerAppWindow) parentNode.registerAppWindow(window);
                    
                    const jsonStr = parentNode.widgets.find(w => w.name === "config_json")?.value || "{}";
                    renderDynamicForm(JSON.parse(jsonStr));
                    
                    initResizeLogic();
                    initLogResizeLogic();
                    handleResponsiveLayout(true); 
                    window.addEventListener('resize', () => handleResponsiveLayout(false));
                    initLightboxEvents();
                } else {
                    document.getElementById('dynamic-form').innerHTML = 
                    `<div style="text-align:center; padding: 20px; color:#f44336; line-height: 1.6;">
                            <p style="font-size: 24px; margin-bottom:10px;">⚠️</p>
                            <p style="font-size: 14px; font-weight:bold;">${t('node_lost_alert', 'The original workflow was closed or not activated!')}</p>
                        </div>`;
                }
            } else {
                document.getElementById('dynamic-form').innerHTML = 
                `<div style="text-align:center; padding: 20px; color:#f44336; line-height: 1.6;">
                        <p style="font-size: 24px; margin-bottom:10px;">⚠️</p>
                        <p style="font-size: 14px; font-weight:bold;">${t('connection_lost', 'Connection lost! Please reopen from the original node.')}</p>
                    </div>`;
            }
        });
        
        let isDesktopState = window.innerWidth >= 768; 
        
        function handleResponsiveLayout(isInit = false) {
            const isDesktop = window.innerWidth >= 768;
            const rightPanel = document.querySelector('.right-panel');
            const viewerContainer = document.querySelector('.viewer-container');
            if (!rightPanel || !viewerContainer) return;
            adjustGalleryLayout();
            if (isInit) {
                if (isDesktop) {
                    const savedWidth = localStorage.getItem('appview_panel_width') || "400";
                    rightPanel.style.width = `${savedWidth}px`;
                    rightPanel.style.flexBasis = `${savedWidth}px`;
                } else {
                    const savedHeight = localStorage.getItem('appview_preview_height') || "30dvh";
                    viewerContainer.style.flex = `0 0 ${savedHeight}px`;
                }
                return;
            }
            if (isDesktop && !isDesktopState) {
                viewerContainer.style.flex = ""; 
                const savedWidth = localStorage.getItem('appview_panel_width') || "400";
                rightPanel.style.width = `${savedWidth}px`;
                rightPanel.style.flexBasis = `${savedWidth}px`; 
                isDesktopState = true;
            } else if (!isDesktop && isDesktopState) {
                rightPanel.style.width = ""; 
                rightPanel.style.flexBasis = ""; 
                const savedHeight = localStorage.getItem('appview_preview_height') || "30dvh";
                viewerContainer.style.flex = `0 0 ${savedHeight}px`; 
                isDesktopState = false;
            }
        }
        
        function adjustGalleryLayout() {
            const isDesktop = window.innerWidth >= 768;
            const gallery = document.getElementById('gallery');
            if (!gallery) return;
            
            if (isDesktop) {
                const viewerContainer = document.querySelector('.viewer-container');
                if (viewerContainer && gallery.parentNode !== viewerContainer) { viewerContainer.appendChild(gallery); }
            } else {
                const actionBar = document.querySelector('.bottom-action-bar');
                const buttonGroup = document.querySelector('.button-group');
                if (actionBar && buttonGroup && gallery.parentNode !== actionBar) { actionBar.insertBefore(gallery, buttonGroup); }
            }
        }
        
        // 核心：同步主画布参数（增加了 🔀 随机模式防跳字拦截）
        function syncParentValuesToAppView() {
            if (!window.comfyApp || !sourceNodeId) return;
            const node = window.comfyApp.graph.getNodeById(sourceNodeId);
            if (!node) return;
            
            for (const widget of node.widgets) {
                const isSeedWidget = !!document.getElementById(`input_action_btn_${widget.name}`);
                if (isSeedWidget) {
                    // 🌟 1. 检查当前的种子模式
                    const modeBtn = document.getElementById(`input_action_btn_${widget.name}`);
                    const isRandomMode = modeBtn && modeBtn.innerText === '🔀';
                    
                    // 🌟 2.【核心防跳字修复】：如果是 🔀 随机模式，绝对禁止读取画布并覆盖 AppView 的数字！
                    if (isRandomMode) {
                        continue; // 👈 直接跳过，死死保持 AppView 提交的真实种子，绝不闪烁跳字！
                    }
                    
                    const inputEl = document.getElementById(`input_${widget.name}`);
                    if (inputEl) {
                        inputEl.value = widget.value;
                        inputEl.dispatchEvent(new Event('change'));
                        inputEl.dispatchEvent(new Event('input'));
                    }
                    
                    if (widget.name === 'control_after_generate') {
                        const idx = node.widgets.indexOf(widget);
                        if (idx > 0) {
                            const seedWidget = node.widgets[idx - 1];
                            const modeBtn = document.getElementById(`input_action_btn_${seedWidget.name}`);
                            if (modeBtn) {
                                const modeIcons = { "fixed": "⏺️", "increment": "⤴️", "decrement": "⤵️", "randomize": "🔀" };
                                modeBtn.innerText = modeIcons[widget.value] || "🔀";
                                modeBtn.title = `Seed Control: ${widget.value}`;
                            }
                        }
                    }
                }
            }
        }
        
        async function renderDynamicForm(config) {
            const formContainer = document.getElementById('dynamic-form');
            formContainer.innerHTML = ''; 
            
            for (const [key, params] of Object.entries(config)) {
                const type = (params.type || "STRING").toUpperCase();
                if (type === "BUTTON") continue; 
                
                const group = document.createElement('div');
                group.className = 'control-group';
                
                const label = document.createElement('label');
                label.className = 'control-title';
                label.innerText = params.name || key;
                group.appendChild(label);
                
                const parentNode = window.comfyApp ? window.comfyApp.graph.getNodeById(sourceNodeId) : null;
                const parentWidget = parentNode ? parentNode.widgets.find(w => w.name === key) : null;
                
                // 💡【核心修复】：三级兜底读取 (parentWidget.value -> params.value -> params.default)
                let currentValue = parentWidget ? parentWidget.value : undefined;
                if (currentValue === undefined || currentValue === null || currentValue === "") {
                    currentValue = params.value !== undefined ? params.value : params.default;
                }
                    
                if (type === "INT" || type === "FLOAT") {
                    const isSlider = params.slider === true || params.display === "slider";
                    const precision = params.precision !== undefined ? Number(params.precision) : (type === "FLOAT" ? 3 : 0);
                    
                    if (isSlider) {
                        const minVal = params.min !== undefined ? Number(params.min) : -999999;
                        const maxVal = params.max !== undefined ? Number(params.max) : 999999;
                        const step = params.step !== undefined ? Number(params.step) : (type === "INT" ? 1 : 0.1);

                        let initVal = Number(currentValue ?? params.default ?? 0);
                        if (initVal < minVal) initVal = minVal;
                        if (initVal > maxVal) initVal = maxVal;

                        const formatVal = (v) => {
                            let n = Number(v);
                            if (Math.abs(n) < 1e-9) n = 0;
                            return type === "FLOAT" ? n.toFixed(precision) : String(Math.round(n));
                        };

                        label.innerHTML = `<span>${params.name || key}</span><span class="slider-value-badge" id="badge_${key}">${formatVal(initVal)}</span>`;

                        const input = document.createElement('input');
                        input.type = 'range';
                        input.min = minVal;
                        input.max = maxVal;
                        input.step = step;
                        input.value = initVal;
                        input.id = `input_${key}`;

                        // 🎨 动态计算渐变进度条 (带纽子 17px 半径物理偏移修正，彻底解决右侧溢出)
                        const updateTrack = () => {
                            const val = Number(input.value);
                            const rawPct = ((val - minVal) / (maxVal - minVal)) * 100;
                            
                            // 📏 获取 input 物理宽度，计算纽子 (Thumb 34px) 的中心点偏移
                            const sliderWidth = input.offsetWidth || 250;
                            const thumbRadius = 17; // 34px / 2
                            const trackRange = Math.max(1, sliderWidth - thumbRadius * 2);
                            
                            // 🎯 将 0~100% 的数值比例映射为滑块纽子中心点的实际物理百分比
                            const fillPx = thumbRadius + (rawPct / 100) * trackRange;
                            const fillPct = (fillPx / sliderWidth) * 100;
                            
                            if (minVal < 0 && maxVal > 0) {
                                // 跨正负数双向 Slider
                                const rawZeroPct = ((-minVal) / (maxVal - minVal)) * 100;
                                const zeroPx = thumbRadius + (rawZeroPct / 100) * trackRange;
                                const zeroPct = (zeroPx / sliderWidth) * 100;
                                
                                if (val >= 0) {
                                    input.style.background = `linear-gradient(to right, var(--panel-bg) 0%, var(--panel-bg) ${zeroPct}%, var(--second) ${zeroPct}%, var(--second) ${fillPct}%, var(--panel-bg) ${fillPct}%, var(--panel-bg) 100%)`;
                                } else {
                                    input.style.background = `linear-gradient(to right, var(--panel-bg) 0%, var(--panel-bg) ${fillPct}%, var(--second) ${fillPct}%, var(--second) ${zeroPct}%, var(--panel-bg) ${zeroPct}%, var(--panel-bg) 100%)`;
                                }
                            } else {
                                // 单向 Slider
                                input.style.background = `linear-gradient(to right, var(--second) 0%, var(--second) ${fillPct}%, var(--panel-bg) ${fillPct}%, var(--panel-bg) 100%)`;
                            }
                        };

                        input.addEventListener('input', () => {
                            const badge = document.getElementById(`badge_${key}`);
                            if (badge) badge.innerText = formatVal(input.value);
                            updateTrack();
                        });

                        setTimeout(updateTrack, 0);
                        group.appendChild(input);
                    } else {
                        const { wrapper, input } = createNumericInput({
                            type: type,
                            value: currentValue ?? 0,
                            min: params.min,
                            max: params.max,
                            step: params.step,
                            precision: precision,
                            id: `input_${key}`
                        });
                        group.appendChild(wrapper);
                    }
                } else if (type === "LORA_STACK") {
                    const container = document.createElement('div');
                    container.className = 'lora-stack-container';
                    
                    const hiddenInput = document.createElement('input');
                    hiddenInput.type = 'hidden';
                    hiddenInput.id = `lora-data_${key}`;
                    hiddenInput.value = currentValue || "[]";
                    container.appendChild(hiddenInput);
                    
                    let loraValues = ["None"];
                    const targetFolder = params.folder || "loras";
                    if (targetFolder) {
                        try {
                            const response = await fetch(`/appbuilder/ls/${targetFolder}`);
                            if (response.ok) {
                                const data = await response.json();
                                loraValues = ["None", ...data];
                            }
                        } catch (e) { console.error(e); }
                    }
                    
                    // 1. 顶部栏：Add 按钮 + 三段式总开关
                    const header = document.createElement('div');
                    header.className = 'lora-stack-header';
                    
                    const btnAdd = document.createElement('button');
                    btnAdd.type = 'button';
                    btnAdd.className = 'btn-add-lora';
                    btnAdd.innerText = t('btn_add_lora', '+ Add LoRA');
                    
                    const masterControlWrap = document.createElement('div');
                    masterControlWrap.style.cssText = 'display: flex; align-items: center; gap: 6px;';
                    
                    const masterLabel = document.createElement('span');
                    masterLabel.style.cssText = 'font-size: 12px; color: var(--title); font-weight: bold;';
                    masterLabel.innerText = t('toggle_all', 'Toggle All');
                    
                    const masterToggle = document.createElement('div');
                    masterToggle.className = 'tri-state-toggle all-off';
                    const masterThumb = document.createElement('div');
                    masterThumb.className = 'tri-state-thumb';
                    masterToggle.appendChild(masterThumb);
                    
                    masterControlWrap.appendChild(masterLabel);
                    masterControlWrap.appendChild(masterToggle);
                    header.appendChild(btnAdd);
                    header.appendChild(masterControlWrap);
                    container.appendChild(header);
                    
                    const rowsContainer = document.createElement('div');
                    rowsContainer.style.cssText = 'display: flex; flex-direction: column; gap: 6px;';
                    container.appendChild(rowsContainer);
                    
                    const updateMasterSwitchState = () => {
                        const rows = rowsContainer.querySelectorAll('.lora-row');
                        if (rows.length === 0) {
                            masterToggle.className = 'tri-state-toggle all-off';
                            return;
                        }
                        
                        let activeCount = 0;
                        rows.forEach(r => {
                            if (r.querySelector('.toggle-switch').classList.contains('active')) {
                                activeCount++;
                            }
                        });
                        
                        if (activeCount === 0) {
                            masterToggle.className = 'tri-state-toggle all-off';
                        } else if (activeCount === rows.length) {
                            masterToggle.className = 'tri-state-toggle all-on';
                        } else {
                            masterToggle.className = 'tri-state-toggle partial';
                        }
                    };
                    
                    const updateHiddenInput = () => {
                        const loras = [];
                        const rows = rowsContainer.querySelectorAll('.lora-row');
                        rows.forEach(row => {
                            loras.push({
                                lora_name: row.querySelector('select').value,
                                strength: parseFloat(row.querySelector('input[type="number"]').value),
                                enabled: row.querySelector('.toggle-switch').classList.contains('active')
                            });
                        });
                        hiddenInput.value = JSON.stringify(loras);
                        
                        if (window.comfyApp && sourceNodeId) {
                            const node = window.comfyApp.graph.getNodeById(sourceNodeId);
                            if (node) {
                                const widget = node.widgets.find(w => w.name === key);
                                if (widget) {
                                    widget.value = hiddenInput.value;
                                    if (widget.callback) widget.callback(hiddenInput.value);
                                }
                            }
                        }
                        updateMasterSwitchState();
                    };
                    
                    const formatStrength = (raw) => {
                        let val = parseFloat(raw);
                        if (isNaN(val)) val = 0.0;
                        if (val < 0.0) val = 0.0;
                        if (val > 100.0) val = 100.0;
                        return val.toFixed(2);
                    };
                    
                    const addSingleRow = (rowData = { lora_name: "None", strength: 1.0, enabled: true }) => {
                        const row = document.createElement('div');
                        row.className = 'lora-row';
                        
                        const btnDel = document.createElement('button');
                        btnDel.type = 'button';
                        btnDel.title = t('remove', 'Remove');
                        btnDel.className = 'btn-del-lora';
                        btnDel.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x-icon lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';
                        btnDel.onclick = () => {
                            row.remove();
                            updateHiddenInput();
                        };
                        
                        const sel = document.createElement('select');
                        // 🔒 确保即使当前保存的 LoRA 名称不在远程列表中，也能正确加入并显示
                        const availableOptions = [...loraValues];
                        if (rowData.lora_name && !availableOptions.includes(rowData.lora_name)) {
                            availableOptions.push(rowData.lora_name);
                        }

                        availableOptions.forEach(v => {
                            const opt = document.createElement('option');
                            opt.value = v; opt.innerText = v;
                            sel.appendChild(opt);
                        });
                        sel.value = rowData.lora_name || "None";
                        sel.onchange = updateHiddenInput;
                        
                        const strInput = document.createElement('input');
                        strInput.type = 'number';
                        strInput.className = 'number-input';
                        strInput.min = '0.00';
                        strInput.max = '100.00';
                        strInput.step = '0.01';
                        strInput.value = formatStrength(rowData.strength ?? 1.0);
                        strInput.onchange = () => {
                            strInput.value = formatStrength(strInput.value);
                            updateHiddenInput();
                        };
                        
                        const toggle = document.createElement('div');
                        toggle.className = 'toggle-switch' + (rowData.enabled ? ' active' : '');
                        toggle.onclick = () => {
                            toggle.classList.toggle('active');
                            updateHiddenInput();
                        };
                        
                        row.appendChild(btnDel);
                        row.appendChild(sel);
                        row.appendChild(strInput);
                        row.appendChild(toggle);
                        rowsContainer.appendChild(row);
                    };
                    
                    masterToggle.onclick = () => {
                        const rows = rowsContainer.querySelectorAll('.lora-row');
                        if (rows.length === 0) return;
                        
                        const isAllOn = masterToggle.classList.contains('all-on');
                        const targetState = !isAllOn;
                        
                        rows.forEach(row => {
                            const toggle = row.querySelector('.toggle-switch');
                            if (targetState) {
                                toggle.classList.add('active');
                            } else {
                                toggle.classList.remove('active');
                            }
                        });
                        
                        updateHiddenInput();
                    };
                    
                    btnAdd.onclick = () => {
                        addSingleRow({ lora_name: "None", strength: 1.0, enabled: true });
                        updateHiddenInput();
                    };
                    
                    // 💡【核心解析】：解析当前的 LoRA 字符串数据并渲染行
                    let initData = [];
                    try { 
                        if (typeof currentValue === 'string') initData = JSON.parse(currentValue || "[]"); 
                        else if (Array.isArray(currentValue)) initData = currentValue;
                    } catch(e){}
                    
                    rowsContainer.innerHTML = '';
                    if (Array.isArray(initData) && initData.length > 0) {
                        initData.forEach(item => addSingleRow(item));
                    }
                    updateHiddenInput();
                    
                    group.appendChild(container);
                } else if (type === "COMBO") {
                    const select = document.createElement('select');
                    select.id = `input_${key}`;
                    let values = params.values ? [...params.values] : [];
                    
                    if (params.folder) {
                        try {
                            const response = await fetch(`/appbuilder/ls/${params.folder}`);
                            if (response.ok) {
                                const data = await response.json();
                                values = ["None", ...data];
                            }
                        } catch (e) { console.error("Fetch models failed:", e); }
                    }
                    
                    if (values.length === 0) values = ["None"];
                    let targetValue = currentValue;
                    if (targetValue === undefined || targetValue === null || targetValue === "") {
                        targetValue = params.default;
                    }
                    
                    if (targetValue === undefined || targetValue === null || targetValue === "") {
                        if (params.folder) {
                            targetValue = "None";
                        } else {
                            targetValue = values[0];
                        }
                    }
                    
                    if (!values.includes(targetValue)) values.unshift(targetValue);
                    
                    select.innerHTML = '';
                    values.forEach(val => {
                        const opt = document.createElement('option');
                        opt.value = val;
                        opt.innerText = val;
                        select.appendChild(opt);
                    });
                    
                    select.value = targetValue;
                    group.appendChild(select);
                } else if (type === "BOOLEAN" || type === "BYPASSER") {
                    const toggleContainer = document.createElement('div');
                    toggleContainer.className = 'segmented-toggle';
                    const input = document.createElement('input');
                    input.type = 'checkbox';
                    input.id = `input_${key}`;
                    input.checked = currentValue ?? true;
                    input.style.display = 'none';
                    
                    const track = document.createElement('div');
                    track.className = 'toggle-track';
                    const labelFalse = document.createElement('div');
                    labelFalse.className = 'toggle-label-half';
                    labelFalse.setAttribute('data-val', 'false');
                    labelFalse.innerText = (type === "BYPASSER") ? t('label_off', 'OFF') : t('label_false', 'False');
                    const labelTrue = document.createElement('div');
                    labelTrue.className = 'toggle-label-half';
                    labelTrue.setAttribute('data-val', 'true');
                    labelTrue.innerText = (type === "BYPASSER") ? t('label_on', 'ON') : t('label_true', 'True');
                    
                    const thumb = document.createElement('div');
                    thumb.className = 'toggle-thumb';
                    
                    track.appendChild(labelFalse); track.appendChild(labelTrue); track.appendChild(thumb);
                    toggleContainer.appendChild(input); toggleContainer.appendChild(track);
                    
                    input.addEventListener('change', () => {
                        if (window.comfyApp && sourceNodeId) {
                            const node = window.comfyApp.graph.getNodeById(sourceNodeId);
                            if (node) {
                                const widget = node.widgets.find(w => w.name === key);
                                if (widget) { widget.value = input.checked; if (widget.callback) widget.callback(input.checked); }
                                }
                            }
                    });
                        
                    toggleContainer.addEventListener('click', () => {
                        input.checked = !input.checked;
                        input.dispatchEvent(new Event('change'));
                    });
                    
                    let startX = 0;
                    toggleContainer.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, {passive: true});
                    toggleContainer.addEventListener('touchend', (e) => {
                        let endX = e.changedTouches[0].clientX;
                        let diffX = endX - startX;
                        if (Math.abs(diffX) > 40) {
                            if (diffX > 0 && !input.checked) { input.checked = true; input.dispatchEvent(new Event('change')); } 
                            else if (diffX < 0 && input.checked) { input.checked = false; input.dispatchEvent(new Event('change')); }
                        }

                    dropzone.ondrop = (e) => {

                    async function handleFileUpload(file) {
                        const mime = file.type || "";
                        const ext = file.name.split('.').pop().toLowerCase();
                        const imageExts = ['png', 'jpg', 'jpeg', 'webp', 'bmp', 'tif', 'tiff', 'jfif', 'jpe', 'tga'];
                        const videoExts = ['mp4', 'webm', 'mkv', 'mov', 'avi', 'gif', 'flv', '3gp'];
                        const audioExts = ['wav', 'mp3', 'ogg', 'flac', 'm4a', 'aac', 'wma'];
                        
                        const isImage = mime.startsWith('image/') || imageExts.includes(ext);
                        const isVideo = mime.startsWith('video/') || videoExts.includes(ext);
                        const isAudio = mime.startsWith('audio/') || audioExts.includes(ext);
                        
                        let isValid = false;
                        if (mediaType === 'image') { isValid = isImage; } 
                        else if (mediaType === 'video') { isValid = isVideo; } 
                        else if (mediaType === 'audio') { isValid = isAudio; } 
                        else { isValid = isImage || isVideo || isAudio; }
                        
                        if (!isValid) {
                            text.innerText = t("label_uploader", "Drop {0} here or click to browse",t(mediaType, mediaType));
                            return;
                        }
                        
                        text.innerText = t('label_uploading', 'Uploading...');
                        const formData = new FormData();
                        formData.append('image', file);
                        
                        try {
                            const response = await fetch('/upload/image', { method: 'POST', body: formData });
                            if (response.ok) {
                                const result = await response.json();
                                valueInput.value = result.name; filenameLabel.innerText = result.name;
                                text.innerText = t("label_uploader", "Drop {0} here or click to browse",t(mediaType, mediaType));
                                valueInput._cachedMaskCanvas = null;            // 👈 修复问题 3：重置 Mask 画板缓存
                                valueInput._originalUnmaskedFilename = result.name; // 👈 修复问题 2：记录最原始未被打孔图片
                                valueInput.dispatchEvent(new Event('change'));
                                updateMediaPreview(result.name);
                            } else { text.innerText = t('label_upfailed', 'Upload failed!'); }
                        } catch (err) { console.error(err); text.innerText = t('label_upfailed', 'Upload failed!'); }
                    }
                    
                    function updateMediaPreview(filename) {
                        previewBox.innerHTML = '';

                        previewBox.classList.remove('collapsed');
                        const fileUrl = `/api/view?filename=${encodeURIComponent(filename)}&type=input`;
                        let mediaElement;

                            maskBtn.title = t('edit_mask', 'Edit Mask');
                            maskBtn.onclick = (e) => {
                                e.stopPropagation();

                        } else if (mediaType === 'audio') {
                            mediaElement = document.createElement('audio'); mediaElement.src = fileUrl; mediaElement.controls = true;
                        } else {
                            const ext = filename.split('.').pop().toLowerCase();
                            if (['mp4', 'webm', 'ogg', 'mov'].includes(ext)) {
                                mediaElement = document.createElement('video'); mediaElement.src = fileUrl; mediaElement.controls = true;
                            } else if (['mp3', 'wav', 'ogg', 'm4a'].includes(ext)) {
                                mediaElement = document.createElement('audio'); mediaElement.src = fileUrl; mediaElement.controls = true;

                        previewBox.appendChild(mediaElement);

                } else if (type === "SEED") {

                    btnRand.onclick = (e) => {

                        const randVal = Math.floor(Math.random() * 1125899906842624).toString();
                        input.value = randVal; input.dispatchEvent(new Event('change'));

                        if (companionWidget) {
                            companionWidget.value = "fixed";
                            if (companionWidget.callback) companionWidget.callback("fixed");

                    };
                    
                    utilGroup.appendChild(btnMode);
                    //utilGroup.appendChild(btnReuse);

                    seedContainer.appendChild(gap);

                    group.appendChild(seedContainer);
                } else {
                    const isMultiline = params.multiline === true;
                    if (isMultiline) {

                        container.appendChild(input);

        function openMultilineEditor(targetInput, title) {
            activeInputEl = targetInput;
            document.getElementById('modal-title').innerText = t("label_editing", "📝 Editing: [{0}]", title);
            const modalTextarea = document.getElementById('multiline-textarea');
            modalTextarea.value = targetInput.value;
            if (targetInput.placeholder) { modalTextarea.placeholder = targetInput.placeholder; } 
            else { modalTextarea.placeholder = ''; }
            document.getElementById('multiline-modal').style.display = 'flex';
        }
        document.getElementById('multiline-modal-close').onclick = closeMultilineModal;
        document.getElementById('multiline-btn-cancel').onclick = closeMultilineModal;
        document.getElementById('multiline-btn-save').onclick = () => {
            if (activeInputEl) {
                activeInputEl.value = document.getElementById('multiline-textarea').value;
                activeInputEl.dispatchEvent(new Event('change'));
            }
            closeMultilineModal();
        };
        function closeMultilineModal() {
            document.getElementById('multiline-modal').style.display = 'none';
            activeInputEl = null;
        }
                        
        // 🔍 规范化 URL (剥离 #t=0.001 等哈希标记用于匹配)
        const normalizeLightboxUrl = (u) => {
            if (!u) return '';
            try {
                return new URL(u, window.location.href).href.split('#')[0];
            } catch(e) {
                return u.split('#')[0];
            }
        };
        
        function openLightbox(src) {
            if (src && !src.startsWith('data:image/svg+xml')) {
                const items = Array.from(document.querySelectorAll('.gallery-item'));
                currentImagesList = items.map(el => normalizeLightboxUrl(el.src || el.currentSrc)).filter(Boolean);
                const absoluteSrc = new URL(src, window.location.href).href;
                currentLightboxIndex = currentImagesList.indexOf(absoluteSrc);
                if (currentLightboxIndex === -1) { currentImagesList = [absoluteSrc]; currentLightboxIndex = 0; }
                updateLightboxUI();
                document.getElementById('lightbox-modal').style.display = 'flex';
            }
        }
        
        function navigateLightbox(dir) {
            lbLastTapTime = 0; // 👈 每次切图，立刻清空双击计时器
            if (currentImagesList.length <= 1) return;
            const nextIndex = currentLightboxIndex + dir;
            if (nextIndex < 0 || nextIndex >= currentImagesList.length) { return; }
            currentLightboxIndex = nextIndex;
            updateLightboxUI();
        }
        
        // 🖼️ ====== 灯箱手势与缩放全功能引擎 ======
        let lbScale = 1;
        let lbTx = 0;
        let lbTy = 0;
        let lbIsDragging = false;
        let lbDragStartX = 0;
        let lbDragStartY = 0;
        let lbStartTx = 0;
        let lbStartTy = 0;
        
        let lbStartPinchDist = 0;
        let lbStartPinchScale = 1;
        let lbLastTapTime = 0;
        
        // 重置缩放状态
        function resetLightboxZoom(smooth = false) {
            const img = document.getElementById('lightbox-img');
            if (!img) return;
            lbScale = 1;
            lbTx = 0;
            lbTy = 0;
            lbIsDragging = false;
            
            if (smooth) {
                img.classList.add('smooth-transform');
                setTimeout(() => img.classList.remove('smooth-transform'), 250);
            } else {
                img.classList.remove('smooth-transform');
            }
            updateLightboxTransform();
        }
        
        // 刷新图片 Transform 位置与边界约束
        function updateLightboxTransform() {
            const img = document.getElementById('lightbox-img');
            if (!img) return;
            
            // 只有放大后才允许平移，并限制拖拽不能超出屏幕边缘
            if (lbScale > 1) {
                img.style.webkitUserDrag = 'none'; // 👈 放大状态下：禁掉原生拖出，改为平移大图视角
                
                const imgWidth = img.offsetWidth * lbScale;
                const imgHeight = img.offsetHeight * lbScale;
                const maxTx = Math.max(0, (imgWidth - window.innerWidth * 0.95) / 2 + 30);
                const maxTy = Math.max(0, (imgHeight - window.innerHeight * 0.90) / 2 + 30);
                
                lbTx = Math.min(maxTx, Math.max(-maxTx, lbTx));
                lbTy = Math.min(maxTy, Math.max(-maxTy, lbTy));
            } else {
                img.style.webkitUserDrag = 'auto'; // 👈 1.0x 原始状态下：允许鼠标直接把图片拖到桌面/PS中
                lbTx = 0;
                lbTy = 0;
            }
            
            img.style.transform = `translate(${lbTx}px, ${lbTy}px) scale(${lbScale})`;
            img.style.cursor = lbScale > 1 ? (lbIsDragging ? 'grabbing' : 'grab') : 'default';
        }
        
        // 双击/双触 缩放切换 (1.0x <-> 2.5x)
        function toggleDoubleTapZoom() {
            if (lbScale > 1) {
                resetLightboxZoom(true);
            } else {
                lbScale = 2.5;
                lbTx = 0;
                lbTy = 0;
                const img = document.getElementById('lightbox-img');
                if (img) {
                    img.classList.add('smooth-transform');
                    setTimeout(() => img.classList.remove('smooth-transform'), 250);
                }
                updateLightboxTransform();
            }
        }
        
        // 计算双指距离
        function getPinchDist(e) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }
        
        function closeLightbox() {
            const lightboxModal = document.getElementById('lightbox-modal');
            if (lightboxModal) lightboxModal.style.display = 'none';
            // 🎬 关闭灯箱时停止视频播放
            const lbVid = document.getElementById('lightbox-video');
            if (lbVid) {
                lbVid.pause();
                lbVid.src = '';
            }
            resetLightboxZoom(false);
        }
                    
        function updateLightboxUI() {
            const imgUrl = currentImagesList[currentLightboxIndex];
            resetLightboxZoom(false); // 切换时自动复原缩放
            
            const lbImg = document.getElementById('lightbox-img');
            let lbVid = document.getElementById('lightbox-video');
            
            // 如果灯箱里还没有 <video> 标签，动态创建一个带控制条的播放器
            if (!lbVid) {
                lbVid = document.createElement('video');
                lbVid.id = 'lightbox-video';
                lbVid.className = 'lightbox-content';
                lbVid.autoplay = true;
                lbVid.loop = true;
                lbVid.controls = true; // 👈 灯箱大图提供播放/暂停/进度条/音量控制
                lbVid.playsInline = true;
                lbVid.style.cssText = 'max-width: 95dvw; max-height: 90dvh; object-fit: contain; display: none; z-index: 11100;';
                const modal = document.getElementById('lightbox-modal');
                const nextBtn = document.getElementById('lightbox-next');
                modal.insertBefore(lbVid, nextBtn);
            }
            
            const isVideo = isVideoUrl(imgUrl);
            
            if (isVideo) {
                if (lbImg) lbImg.style.display = 'none';
                lbVid.src = imgUrl;
                lbVid.muted = true;         // 👈 默认静音
                lbVid.defaultMuted = true;
                lbVid.style.display = 'block';
                lbVid.play().catch(()=>{});
            } else {
                if (lbVid) {
                    lbVid.style.display = 'none';
                    lbVid.pause();
                }
                if (lbImg) {
                    lbImg.src = imgUrl;
                    lbImg.style.display = 'block';
                }
            }
            
            const prevBtn = document.getElementById('lightbox-prev');
            const nextBtn = document.getElementById('lightbox-next');
            if (prevBtn && nextBtn) {
                prevBtn.style.display = (currentLightboxIndex === 0) ? 'none' : 'flex';
                nextBtn.style.display = (currentLightboxIndex === currentImagesList.length - 1) ? 'none' : 'flex';
            }
            const lbDl = document.getElementById('lightbox-download');
            if (lbDl) {
                lbDl.href = imgUrl;
                const fn = new URL(imgUrl, window.location.href).searchParams.get('filename') || 'media';
                lbDl.download = fn;
            }
        }
        
        function initLightboxEvents() {
            const lightboxModal = document.getElementById('lightbox-modal');
            const img = document.getElementById('lightbox-img');
            if (!lightboxModal || !img) return;
            
            document.getElementById('lightbox-prev').onclick = (e) => { e.stopPropagation(); navigateLightbox(-1); };
            document.getElementById('lightbox-next').onclick = (e) => { e.stopPropagation(); navigateLightbox(1); };
            document.getElementById('lightbox-close').onclick = (e) => { e.stopPropagation(); closeLightbox(); };
            
            window.addEventListener('keydown', (e) => {
                if (lightboxModal.style.display !== 'flex') return;
                
                // 忽略在输入框/文本域打字时的键盘事件
                const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
                if (activeTag === 'input' || activeTag === 'textarea' || activeTag === 'select') return;
                
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    navigateLightbox(-1);
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    navigateLightbox(1);
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    closeLightbox();
                }
            });
            
            // 1. 💻 电脑端：鼠标滚轮缩放
            lightboxModal.addEventListener('wheel', (e) => {
                if (lightboxModal.style.display !== 'flex') return;
                e.preventDefault();
                
                const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
                let newScale = lbScale * zoomFactor;
                if (newScale < 1) newScale = 1;
                if (newScale > 4) newScale = 4;
                
                lbScale = newScale;
                updateLightboxTransform();
            }, { passive: false });
            
            // 2. 💻 电脑端：鼠标双击放大 / 鼠标拖拽查看
            img.addEventListener('dblclick', (e) => {
                e.preventDefault();
                toggleDoubleTapZoom();
            });
            
            img.addEventListener('mousedown', (e) => {
                if (lbScale > 1) {
                    e.preventDefault();
                    lbIsDragging = true;
                    lbDragStartX = e.clientX;
                    lbDragStartY = e.clientY;
                    lbStartTx = lbTx;
                    lbStartTy = lbTy;
                    updateLightboxTransform();
                }
            });
            
            window.addEventListener('mousemove', (e) => {
                if (lbIsDragging && lbScale > 1) {
                    e.preventDefault();
                    lbTx = lbStartTx + (e.clientX - lbDragStartX);
                    lbTy = lbStartTy + (e.clientY - lbDragStartY);
                    updateLightboxTransform();
                }
            });
            
            window.addEventListener('mouseup', () => {
                if (lbIsDragging) {
                    lbIsDragging = false;
                    updateLightboxTransform();
                }
            });
            
            // 3. 📱 移动端：双指捏合缩放 + 单指拖拽查看 + 双触快速放大 + 1.0x 左右划动翻页
            let swipeStartY = 0; // 记录 Y 轴起点
            
            lightboxModal.addEventListener('touchstart', (e) => {
                if (lightboxModal.style.display !== 'flex') return;
                
                const isImg = (e.target.id === 'lightbox-img');
                
                // 双触判定 (Double Tap) - 仅限图片本体
                const now = Date.now();
                if (isImg && e.touches.length === 1 && now - lbLastTapTime < 300) {
                    e.preventDefault();
                    toggleDoubleTapZoom();
                    lbLastTapTime = 0;
                    return;
                }
                if (isImg && e.touches.length === 1) lbLastTapTime = now;
                
                if (isImg && e.touches.length === 2) {
                    lbLastTapTime = 0; // 双指捏合时瞬间作废双击
                    e.preventDefault();
                    lbStartPinchDist = getPinchDist(e);
                    lbStartPinchScale = lbScale;
                } else if (e.touches.length === 1) {
                    swipeStartX = e.touches[0].clientX;
                    swipeStartY = e.touches[0].clientY; // 记录 Y 轴起点
                    if (isImg && lbScale > 1) {
                        lbIsDragging = true;
                        lbDragStartX = e.touches[0].clientX;
                        lbDragStartY = e.touches[0].clientY;
                        lbStartTx = lbTx;
                        lbStartTy = lbTy;
                    }
                }
            }, { passive: false });
            
            lightboxModal.addEventListener('touchmove', (e) => {
                if (lightboxModal.style.display !== 'flex') return;
                
                // 🌟 核心修复：只要手指发生明显划动 (>8px)，立刻作废双击计时器！
                if (e.touches.length === 1) {
                    const currentX = e.touches[0].clientX;
                    const currentY = e.touches[0].clientY;
                    const diffX = Math.abs(currentX - swipeStartX);
                    const diffY = Math.abs(currentY - swipeStartY);
                    
                    if (diffX > 8 || diffY > 8) lbLastTapTime = 0; // 👈 手指动了，说明是划动切图/拖拽，绝对不是双击！
                }
                
                if (e.touches.length === 2) {
                    lbLastTapTime = 0;
                    e.preventDefault();
                    const dist = getPinchDist(e);
                    if (lbStartPinchDist > 0) {
                        let newScale = (dist / lbStartPinchDist) * lbStartPinchScale;
                        if (newScale < 1) newScale = 1;
                        if (newScale > 4) newScale = 4;
                        lbScale = newScale;
                        updateLightboxTransform();
                    }
                } else if (e.touches.length === 1 && lbIsDragging && lbScale > 1) {
                    e.preventDefault();
                    const dx = e.touches[0].clientX - lbDragStartX;
                    const dy = e.touches[0].clientY - lbDragStartY;
                    lbTx = lbStartTx + dx;
                    lbTy = lbStartTy + dy;
                    updateLightboxTransform();
                }
            }, { passive: false });
            
            lightboxModal.addEventListener('touchend', (e) => {
                if (lightboxModal.style.display !== 'flex') return;
                
                if (e.touches.length < 2) {
                    lbStartPinchDist = 0;
                }
                if (e.touches.length === 0) {
                    if (lbIsDragging) {
                        lbIsDragging = false;
                        updateLightboxTransform();
                    } else if (lbScale === 1) {
                        // 未放大状态下：单指划动翻页 (上一张/下一张)
                        const endX = e.changedTouches[0].clientX;
                        const diffX = endX - swipeStartX;
                        if (Math.abs(diffX) > 50) {
                            if (diffX > 0) navigateLightbox(-1);
                            else navigateLightbox(1);
                        }
                    }
                }
            });
            
            // 点击背景黑色遮罩关闭灯箱
            lightboxModal.onclick = (e) => {
                if (e.target.id === 'lightbox-modal' || e.target.id === 'lightbox-close') {
                    closeLightbox();
                }
            };
        }
        
        function applyMobileLayout(targetLogHeight) {
            const isDesktop = window.innerWidth >= 768;
            if (isDesktop) return; 
            
            const logContainer = document.getElementById('log-drawer-container');
            const viewerContainer = document.querySelector('.viewer-container');
            if (!logContainer || !viewerContainer) return;
            
            const totalHeight = window.innerHeight;
            const minRightPanelHeight = 149; 
            const minViewerHeight = 145;
            
            let preferredPreviewHeight = parseInt(localStorage.getItem('appview_preview_height'));
            if (isNaN(preferredPreviewHeight)) { preferredPreviewHeight = totalHeight * 0.3; }
            
            const maxLogHeight = totalHeight - minViewerHeight - minRightPanelHeight;
            let finalLogHeight = targetLogHeight;
            if (finalLogHeight > maxLogHeight) finalLogHeight = maxLogHeight;
            if (finalLogHeight < 0) finalLogHeight = 0;
            
            let expectedRightPanelHeight = totalHeight - preferredPreviewHeight;
            let actualViewerHeight = totalHeight - finalLogHeight - expectedRightPanelHeight;
            if (actualViewerHeight < minViewerHeight) { actualViewerHeight = minViewerHeight; }
            
            viewerContainer.style.flex = `0 0 ${actualViewerHeight}px`;
            logContainer.style.height = `${finalLogHeight}px`;
            
            if (finalLogHeight > 0) {
                logHeight = finalLogHeight;
                localStorage.setItem('appview_log_height', finalLogHeight);
            }
        }
        
        function initLogResizeLogic() {
            const logResizer = document.getElementById('log-resizer');
            const logContainer = document.getElementById('log-drawer-container');
            const mainLayout = document.querySelector('.main-layout');
            const logContent = document.getElementById('log-content');
            const rightPanel = document.querySelector('.right-panel');
            let isDraggingLog = false; let dragVisibleBottomY = 0;
            if (!logResizer) return;
            logResizer.addEventListener('mousedown', startLogDrag); logResizer.addEventListener('touchstart', startLogDrag, { passive: false });
            function startLogDrag(e) {
                e.preventDefault(); isDraggingLog = true; logContainer.classList.add('dragging');
                mainLayout.style.pointerEvents = 'none'; document.body.style.cursor = 'row-resize';
                if (logContent) { dragVisibleBottomY = logContent.scrollTop + logContent.clientHeight; }
                document.addEventListener('mousemove', logDrag); document.addEventListener('touchmove', logDrag, { passive: false });
                document.addEventListener('mouseup', stopLogDrag); document.addEventListener('touchend', stopLogDrag);
            }
            function logDrag(e) {
                if (!isDraggingLog) return;
                if (e.cancelable) e.preventDefault(); 
                const clientY = (e.touches && e.touches.length > 0) ? e.touches[0].clientY : e.clientY;
                const totalHeight = window.innerHeight;
                let newHeight = totalHeight - clientY;
                if (newHeight < 100) newHeight = 100;
                const isDesktop = window.innerWidth >= 768;
                const safetyMargin = isDesktop ? 220 : 295; 
                if (newHeight > totalHeight - safetyMargin) { newHeight = totalHeight - safetyMargin; }
                if (isDesktop) {
                    logContainer.style.height = `${newHeight}px`; logHeight = newHeight; localStorage.setItem('appview_log_height', newHeight);
                } else { applyMobileLayout(newHeight); }
                if (logContent) {
                    let targetScrollTop = dragVisibleBottomY - logContent.clientHeight;
                    const maxScroll = logContent.scrollHeight - logContent.clientHeight;
                    if (targetScrollTop < 0) targetScrollTop = 0; if (targetScrollTop > maxScroll) targetScrollTop = maxScroll;
                    logContent.scrollTop = targetScrollTop;
                }
            }
            function stopLogDrag() {
                isDraggingLog = false; logContainer.classList.remove('dragging'); mainLayout.style.pointerEvents = 'auto'; document.body.style.cursor = '';
                document.removeEventListener('mousemove', logDrag); document.removeEventListener('touchmove', logDrag);
                document.removeEventListener('mouseup', stopLogDrag); document.removeEventListener('touchend', stopLogDrag);
                if (logContainer) { logHeight = parseInt(logContainer.style.height) || logHeight; }
            }
        }
        
        // 📐【自包含完整版 - 双重手势互斥锁+防并发滚动缩放引擎】
        function initResizeLogic() {
            const resizer = document.getElementById('resizer');
            const viewerContainer = document.querySelector('.viewer-container');
            const rightPanel = document.querySelector('.right-panel');
            const logContainer = document.getElementById('log-drawer-container');
            const controlsSection = document.getElementById('dynamic-form'); // 👈 参数滚动容器
            
            let isDragging = false;
            let isListScrolling = false;
            let scrollDebounceTimer = null;
            
            // 1. 监测参数列表的真实物理滚动
            if (controlsSection) {
                controlsSection.addEventListener('scroll', () => {
                    isListScrolling = true;
                    if (scrollDebounceTimer) clearTimeout(scrollDebounceTimer);
                    scrollDebounceTimer = setTimeout(() => {
                        isListScrolling = false;
                    }, 150);
                }, { passive: true });
            }
            
            if (!resizer) return;
            
            // ====== 💻 桌面端：鼠标点击即时响应 ======
            resizer.addEventListener('mousedown', startMouseDrag);
            
            function startMouseDrag(e) {
                e.preventDefault();
                startDraggingState();
                document.addEventListener('mousemove', drag);
                document.addEventListener('mouseup', stopDrag);
            }
                        
            // ====== 📱 移动端：触摸状态互斥锁 ======
            resizer.addEventListener('touchstart', (e) => {
                if (!e.touches || e.touches.length === 0) return;
                
                // 如果列表处于滚动滑动中，不响应拖拽
                if (isListScrolling) {
                    isDragging = false;
                    return;
                }
                
                // 开启拖拽状态，同时冻结列表
                startDraggingState();
            }, { passive: true });
            
            resizer.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                
                // 确认是在拖拽状态后，拦截原生手势
                if (e.cancelable) e.preventDefault();
                drag(e);
            }, { passive: false });
            
            resizer.addEventListener('touchend', stopDrag);
            resizer.addEventListener('touchcancel', stopDrag);
            
            // 🔒 激活拖拽状态（同时强行冻结列表滚动！）
            function startDraggingState() {
                isDragging = true;
                resizer.classList.add('dragging');
                viewerContainer.style.pointerEvents = 'none';
                rightPanel.style.pointerEvents = 'none';
                
                // 🌟【核心锁死】：在拖拽面板期间，把参数列表的 overflowY 设为 hidden，强行冻结滚动！
                if (controlsSection) {
                    controlsSection.style.overflowY = 'hidden';
                }
            }
                        
            // 拖拽计算核心
            function drag(e) {
                if (!isDragging) return;
                const isDesktop = window.innerWidth >= 768;
                
                const clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
                const clientY = (e.touches && e.touches.length > 0) ? e.touches[0].clientY : e.clientY;
                
                if (isDesktop) {
                    const totalWidth = window.innerWidth;
                    let newWidth = totalWidth - clientX;
                    
                    if (newWidth < 250) newWidth = 250;
                    if (newWidth > totalWidth - 150) newWidth = totalWidth - 150;
                    
                    rightPanel.style.flexBasis = `${newWidth}px`;
                    rightPanel.style.width = `${newWidth}px`;
                    localStorage.setItem('appview_panel_width', newWidth);
                } else {
                    let newHeight = clientY;
                    const totalHeight = window.innerHeight;
                    
                    if (newHeight < 145) newHeight = 145;
                    const minRightPanelHeight = 149;
                    
                    if (isLogOpen) {
                        const availableSpaceForLog = totalHeight - newHeight - minRightPanelHeight;
                        if (logHeight > availableSpaceForLog) {
                            let tempLogHeight = availableSpaceForLog;
                            if (tempLogHeight < 100) {
                                tempLogHeight = 100;
                            } else {
                                if (logContainer) logContainer.style.height = `${tempLogHeight}px`;
                                logHeight = tempLogHeight;
                                localStorage.setItem('appview_log_height', logHeight);
                            }
                        }
                    }
                                
                    const absoluteMaxViewerHeight = totalHeight - (isLogOpen ? logHeight : 0) - minRightPanelHeight;
                    if (newHeight > absoluteMaxViewerHeight) {
                        newHeight = absoluteMaxViewerHeight;
                    }
                    
                    viewerContainer.style.flex = `0 0 ${newHeight}px`;
                    
                    const impliedPreferredHeight = newHeight + (isLogOpen ? logHeight : 0);
                    localStorage.setItem('appview_preview_height', impliedPreferredHeight);
                }
            }
            
            // 解锁并恢复列表滚动能力
            function stopDrag() {
                isDragging = false;
                resizer.classList.remove('dragging');
                
                viewerContainer.style.pointerEvents = 'auto';
                rightPanel.style.pointerEvents = 'auto';
                document.body.style.cursor = '';
                
                // 🌟【解锁恢复】：松开手指后，立刻恢复参数列表原有的自然滚动能力
                if (controlsSection) {
                    controlsSection.style.overflowY = 'auto';
                }
                
                document.removeEventListener('mousemove', drag);
                document.removeEventListener('mouseup', stopDrag);
            }
        }

        async function pasteClipboardMedia(onFileObtained) {
            if (navigator.clipboard && navigator.clipboard.read) {
                try {
                    const clipboardItems = await navigator.clipboard.read();
                    for (const item of clipboardItems) {
                        for (const type of item.types) {
                            if (type.startsWith('image/') || type.startsWith('video/') || type.startsWith('audio/')) {
                                const blob = await item.getType(type);
                                const ext = type.split('/')[1] || 'png';
                                const file = new File([blob], `pasted_media_${Date.now()}.${ext}`, { type });
                                onFileObtained(file);
                                return;
                            }
                        }
                    }
                } catch (err) {
                    console.warn("Clipboard API Direct read blocked, using prompt fallback:", err);
                }
            }
            
            showHttpPastePrompt(onFileObtained);
        }

            const promptDesc = isMobileDevice ? t("tap_to_paste", "Tap or touch and hold the box below, then tap【Paste】") : t("shortcut_required","(You must use the keyboard shortcut to paste in a non-secure context)");

                    <button id="close-paste-overlay" style="padding: 8px 20px; background: var(--border); border: none; color: var(--text); font-weight: bold; border-radius: 6px; cursor: pointer;">${t("cancel", "Cancel")}</button>

                if (items) {
