<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ComfyUI AppBuilder</title>
    <style>
        :root {
            --bg: #000000;
            --bg-color: #1c1c1c;
            --bg-badge: rgba(255,255,255,0.3);
            --panel-bg: #393939;
            --primary: #4CAF50;
            --second: #418a44;
            --text: #FFFFFF;
            --title: #AAAAAA;
            --border: #555555;
            --border-neg: #D8D8D8;
            --shadow: rgb(0,0,0,0.7);
            --red: #dc4125;
        }
        
        /* 🌓 浅色主题 */
        :root.light-theme {
            --bg: #FFFFFF;
            --bg-color: #F1F1F1;
            --bg-badge: rgba(128,128,128,0.4);
            --panel-bg: #FFFFFF;
            --primary: #4CAF50;
            --second: #5acc5e;
            --text: #000000;
            --title: #555555;
            --border: #D8D8D8;
            --border-neg: #333333;
            --shadow: rgb(0,0,0,0.);
            --red: #dc4125;
        }
        
        .splash-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background-color: var(--bg); z-index: 999998;
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            opacity: 1; visibility: visible; transition: opacity 0s cubic-bezier(0.25, 1, 0.5, 1), visibility 0s linear 0s;
        }
        .splash-screen.fade-out {
            opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), visibility 0s linear 0.4s;
        }
        .splash-content { text-align: center; }
        /* 🎛️ Splash 屏 Emoji 定时旋转停顿动画 */
        .splash-icon { 
            font-size: 64px; 
            display: inline-block; 
            margin-bottom: 16px;
        }
        
        .splash-icon.loading {
            animation: spinAndPause 3s infinite cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: center center;
            will-change: transform, filter;
        }
        
        @keyframes spinAndPause {
            0% { transform: rotate(0deg) scale(1); }
            30% { transform: rotate(180deg) scale(1); }
            50% { transform: rotate(180deg) scale(1); }
            80% { transform: rotate(360deg) scale(1); }
            100% { transform: rotate(360deg) scale(1); }
        }
        .splash-title {
            font-size: 24px; font-weight: bold; color: var(--text); letter-spacing: 1.5px;
            font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui,sans-serif;
        }
        .splash-subtitle {
            font-size: 13px; font-weight: bold; color: var(--title); display: none;
            font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui,sans-serif;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            background-color: var(--bg);
            overscroll-behavior-y: none; 
            overscroll-behavior: none;
            touch-action: manipulation !important;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column;  height: 100dvh; overflow: hidden; 
            -webkit-user-select: none; 
            -moz-user-select: none;    
            -ms-user-select: none;     
            user-select: none;         
            -webkit-touch-callout: none; 
        }
        
        input, select, textarea, #lightbox-img {
            -webkit-user-select: auto !important;
            user-select: auto !important;
            -webkit-touch-callout: default !important; 
        }

        body, button, input, select, textarea, .segmented-toggle, .gallery-item {
            touch-action: manipulation;
        }
        
        select {
            text-overflow: ellipsis !important; /* 超长自动省略号 */
            white-space: nowrap !important; overflow: hidden !important;
            
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='10' viewBox='0 0 12 10'><polygon points='0,1 12,1 6,9' fill='%23AAAAAA'/></svg>") !important;
            background-repeat: no-repeat !important;
            background-position: left 7px center !important;
            padding-left: 24px !important;
        }
        :root.light-theme select {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='10' viewBox='0 0 12 10'><polygon points='0,1 12,1 6,9' fill='%23555555'/></svg>") !important;
        }

        .progress-bar-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 4px;
            background-color: transparent; z-index: 999999; pointer-events: none;
        }
        .progress-bar-fill {
            width: 0%; height: 100%; background-color: var(--primary); transition: width 0.1s ease-out;
        }

        .viewer-container {
            display: flex; flex-direction: column;
            flex: 0 0 30dvh;
            background-color: #000; overflow: hidden;
        }

        .preview-section {
            flex: 1; background-color: var(--bg); display: flex; justify-content: center;
            position: relative; overflow: hidden; padding: 46px 8px 8px 8px; align-items: center;
        }
        
        #main-preview { 
            max-width: 100%; max-height: 100%; object-fit: contain; 
            pointer-events: none; user-select: none; -webkit-user-drag: none; 
        }

        .gallery-container { 
            display: flex; align-items: center; padding: 0 16px; gap: 10px; height: 72px;
            background-color: var(--bg); border-top: 1px solid var(--border);
            border-top-left-radius: 24px; border-top-right-radius: 24px; padding-top: 8px;
            overflow: hidden; 
        }
        
        .gallery-scroll-wrap {
            flex: 1; display: flex; overflow-x: auto; overflow-y: hidden; align-items: center;
            height: 100%; gap: 8px; touch-action: pan-x; padding: 5px 0;
        }
        .gallery-scroll-wrap::-webkit-scrollbar { display: none; }
        
        .gallery-item {
            height: 60px; border-radius: 6px; object-fit: cover; flex-shrink: 0;
            border: 2px solid var(--border); cursor: pointer; user-select: none; -webkit-user-drag: none;
        }
        /* 🎬 画廊视频封面包裹器与假播放按钮 */
        .gallery-item-wrap {
            position: relative; display: inline-block; height: 60px; flex-shrink: 0; cursor: pointer;
        }
        .gallery-play-badge {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 26px; height: 26px; background: rgba(0, 0, 0, 0.65);
            border: 1.5px solid #ffffff; border-radius: 50%; color: #ffffff; font-size: 11px;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none; padding-left: 2px; box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        
        .gallery-clear-btn {
            flex-shrink: 0; width: 3rem; height: 60px; border-radius: 8px; background-color: #444; border: none;
            color: #FFF; font-size: 18px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .gallery-clear-btn:hover { background-color: var(--red); }
        .gallery-item-placeholder {
            width: 60px; height: 60px; border-radius: 6px; flex-shrink: 0;
            background-color: var(--panel-bg); border: 2px solid var(--border);
            animation: galleryPulse 1.5s infinite ease-in-out;
        }
        @keyframes galleryPulse {
            0% { opacity: 0.6; }
            50% { opacity: 0.3; }
            100% { opacity: 0.6; }
        }

        .status-badge {
            position: absolute; top: 10px; right: 50px; background: var(--border); height: 24px;
            padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; color: var(--title); z-index: 10;
            border: 1px solid var(--title); text-shadow: 0px 1px 0px var(--panel-bg);
        }
        @supports (-webkit-hyphens: none) {
            .status-badge { right: 55px; }
        }
        
        .back-badge { display: none; width: 32px !important; left: 10px; right: auto; color: #FFF; background-color: #d13d22; border: 1px solid #e6583e; text-shadow: none;}

        .resizer {
            height: 18px; width: 100%; cursor: row-resize; flex-shrink: 0;
            position: relative; z-index: 100; user-select: none; background-color: var(--bg-color);
        }
        .resizer::after {
            content: ''; position: absolute; left: 50%; top: 8px; transform: translate(-50%, -50%);
            width: 100px; height: 4px; background: var(--title); border-radius: 2px;
        }

        .right-panel {
            flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; border-top: 2px solid var(--border);
            box-shadow: 0px 0px 30px var(--shadow); border-top-left-radius: 24px; border-top-right-radius: 24px;
        }

        .controls-section {
            flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
            padding: 8px 16px; padding-bottom: 140px; background-color: var(--bg-color);
        }
        .controls-section::-webkit-scrollbar { display: none; }
        .control-group { margin-bottom: 8px;}
        
        .control-group label.control-title {
            display: flex;                  
            align-items: center;            
            justify-content: space-between; 
            margin-bottom: 3px; 
            font-size: 13px; 
            color: var(--title);
        }
        
        .control-group label.control-title span:first-child {
            flex: 1;                        
            min-width: 0;                   
            white-space: nowrap;            
            overflow: hidden;               
            text-overflow: ellipsis;        
            padding-right: 8px;             
        }
        
        .slider-value-badge {
            flex-shrink: 0;                 
            display: inline-block;          
            background: rgba(255, 255, 255, 0.06); 
            border: 1px solid var(--border); 
            padding: 1px 6px;
            border-radius: 4px; 
            font-size: 11px; 
            font-weight: bold; 
            font-family: monospace;
            color: var(--title); 
            background-color: var(--panel-bg);
            user-select: none;
        }
        
        input[type="text"], select {
            width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); font-family: monospace;
            background: var(--panel-bg); color: var(--text); font-size: 14px; appearance: none; height: 36px;
        }
        input[type="number"] {
            width: 100%; padding: 8px 10px; background: var(--panel-bg); color: var(--text); font-size: 14px; appearance: none;
            border: none; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); border-radius: 0px;
            height: 36px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; /* 👈 改为居中对齐 */
        }

        textarea.tight-textarea {
            height: 36px; width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--panel-bg); color: var(--text); font-size: 14px; font-family: monospace;
            resize: none; white-space: pre-wrap; line-height: 18px; overflow-y: hidden;
        }
        textarea.tight-textarea:focus { outline: none; border-color: var(--primary); }

        input[type="range"] {
            -webkit-appearance: none;
            -moz-appearance: none; 
            appearance: none;
            width: 100%;
            height: 36px; 
            background: var(--panel-bg); 
            border: 1px solid var(--border); 
            border-radius: 18px;
            outline: none;
            overflow: hidden;
            touch-action: none; 
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 34px; 
            height: 34px;
            background: var(--primary); 
            border-radius: 50%;
            cursor: pointer;
            box-shadow: -1016px 0 0 1000px var(--second); 
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 34px;
            height: 34px;
            background: var(--primary); 
            border: none; 
            border-radius: 50%;
            cursor: pointer;
            box-shadow: -1016px 0 0 1000px var(--second); 
        }
        
        input[type="range"]::-moz-range-track {
            width: 100%;
            height: 36px;
            background: transparent;
            border: none; 
        }
        
        input[type="range"]::-moz-range-progress {
            background: transparent;
            border: none;
        }

        .numeric-input-wrapper { display: flex; align-items: center; width: 100%; gap: 0px; }
        .numeric-input-wrapper input { flex: 1; text-align: center; }
        .btn-numeric-adjust {
            background: var(--panel-bg); border: 1px solid var(--border); color: var(--title);
            width: 2.5rem; height: 36px; cursor: pointer; font-size: 18px; font-weight: bold;
            display: flex; align-items: center; justify-content: center; user-select: none;
        }
        .btn-numeric-adjust-right { border-top-right-radius: 8px; border-bottom-right-radius: 8px; }
        .btn-numeric-adjust-left { border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
        .btn-numeric-adjust:hover { background: var(--border); }

        .segmented-toggle {
            width: 100%; height: 36px; background: var(--panel-bg); border: 1px solid var(--border);
            border-radius: 8px; position: relative; cursor: pointer; overflow: hidden;
        }
        .toggle-track { display: flex; height: 100%; position: relative; z-index: 1; }
        .toggle-label-half {
            flex: 1; display: flex; align-items: center; justify-content: center; user-select: none;
            font-size: 13px; font-weight: bold; color: var(--text); transition: color 0.2s; z-index: 2; 
        }
        .toggle-thumb {
            position: absolute; top: 2px; left: 2px; height: calc(100% - 4px);
            width: calc(50% - 4px); background: var(--border); border-radius: 6px;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), background 0.2s; z-index: 1;
        }
        input[type="checkbox"]:checked + .toggle-track .toggle-thumb { transform: translateX(calc(100% + 4px)); background: var(--primary); }
        input[type="checkbox"]:checked + .toggle-track .toggle-label-half[data-val="true"] { color: #fff; }
        input[type="checkbox"]:not(:checked) + .toggle-track .toggle-label-half[data-val="false"] { color: #fff; }

        /* 🔥 Lora Stack 样式注入区域 */
        /* 🎚️ 独立单行开关（保持你原有的 CSS） */
        .toggle-switch {
            position: relative; width: 2.5rem; height: 36px; border-radius: 8px;
            background-color: var(--border);
            cursor: pointer; transition: background-color 0.3s;
            flex-shrink: 0;
        }
        .toggle-switch::after {
            content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 32px;
            background-color: #fff; border-radius: 6px;
            transition: transform 0.3s, background-color 0.3s;
        }
        .toggle-switch.active { background-color: var(--primary);}
        .toggle-switch.active::after { transform: translateX(18px); }
        
        /* 📦 容器与 4-in-1 无缝胶囊行 */
        .lora-stack-container { display: flex; flex-direction: column; gap: 6px; width: 100%; }
        .lora-row { display: flex; gap: 0px; align-items: center; width: 100%; }
        
        /* 1. 🗑️ 无缝吸附在最左侧的删除按钮 */
        .btn-del-lora {
            width: 2.5rem; height: 36px; background: var(--panel-bg);
            border: 1px solid var(--border); border-right: none;
            border-top-left-radius: 8px; border-bottom-left-radius: 8px;
            color: var(--red); font-size: 13px; cursor: pointer; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-del-lora:hover { background: var(--border); color: var(--red); }
        
        /* 2. 中间的 LoRA 下拉框 (左右均无缝无圆角) */
        .lora-row select {
            flex: 3; min-width: 0; height: 36px; font-size: 0.8rem;
            padding-right: 6px !important;
            border-radius: 0px !important; text-overflow: ellipsis !important; /* 超长自动省略号 */
            white-space: nowrap !important; overflow: hidden !important;
        }
        
        /* 1. 强度输入框：恢复右侧圆角与右边框 */
        .lora-row input[type="number"] {
            width: 2.5rem; height: 36px; text-align: center;
            padding-left: 2px !important; padding-right: 2px !important;
            border-radius: 0px !important; 
            border-radius: 0px 8px 8px 0px !important;
            border-right: 1px solid var(--border) !important; /* 👈 恢复右边框 */
            border-left: none !important;
        }
        
        /* 2. 独立开关：恢复四周独立圆角，并向左拉开 6px 的隔离带 */
        .lora-row .toggle-switch {
            margin-left: 6px;               /* 👈 就是这个 margin-left 拉开了左侧间隔！ */
            border-radius: 8px !important;  /* 👈 恢复四周完整的独立圆角 */
        }
        
        /* 🎛️ 顶部工具栏 */
        .lora-stack-header {
            display: flex; justify-content: space-between; align-items: center;
        }
        
        /* + Add LoRA 按钮 */
        .btn-add-lora {
            background: var(--panel-bg); border: 1px solid var(--border);
            color: var(--title); height: 36px; padding: 0 12px; border-radius: 8px;
            font-size: 12px; font-weight: bold; cursor: pointer;
        }
        .btn-add-lora:hover { background-color: var(--border); }
        
        /* 🎚️ 三段式总开关 (遵循相同的 36px 高度与滑块语言) */
        .tri-state-toggle {
            position: relative; width: 2.5rem; height: 36px; border-radius: 8px;
            background-color: var(--border);
            cursor: pointer; transition: background-color 0.3s, border 0.3s; flex-shrink: 0;
        }
        .tri-state-thumb {
            position: absolute; top: 2px; left: 2px; width: 18px; height: 32px;
            background-color: #fff; border-radius: 6px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s;
        }
        
        /* 三段位置控制 */
        .tri-state-toggle.all-off .tri-state-thumb { transform: translateX(0px); }
        .tri-state-toggle.partial { background-color: var(--border); }
        .tri-state-toggle.partial .tri-state-thumb { transform: translateX(9px); }
        .tri-state-toggle.all-on { background-color: var(--primary); }
        .tri-state-toggle.all-on .tri-state-thumb { transform: translateX(18px);  }

        .input-with-button { display: flex; gap: 6px; width: 100%; }
        .btn-edit-multiline {
            background: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; width: 2.5rem; height: 57px; 
            flex-shrink: 0; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center;
        }
        .btn-edit-multiline:hover { background: var(--border); }
        
        .input-with-button input, .input-with-button textarea { flex: 1; width: auto; }
        
        .uploader-control-row { display: flex; gap: 6px; width: 100%; }
        .uploader-dropzone {
            flex: 1; padding: 10px; border: 2px dashed var(--border); border-radius: 8px;
            background: var(--bg); text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; user-select: none;
            outline: none;
        }
        .uploader-dropzone.dragover { border-color: var(--primary); background: rgba(76, 175, 80, 0.05); }
        .uploader-dropzone:hover { background: rgba(76, 175, 80, 0.05); }
        .uploader-text { font-size: 13px; color: #888; }
        .uploader-filename { font-size: 12px; color: var(--primary); word-break: break-all; margin-top: 2px; font-weight: bold; }
        
        /* 📋 上下排列的按钮组样式 */
        .uploader-btn-group { display: flex; flex-direction: column; gap: 6px; width: 2.5rem; flex-shrink: 0; }
        .uploader-btn {
            background: var(--panel-bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px;
            width: 2.5rem; height: 100%; min-height: 36px; cursor: pointer; font-size: 16px; display: flex;
            align-items: center; justify-content: center; user-select: none; flex: 1;
        }
        .uploader-btn:hover { background-color: var(--border); }
        .uploader-preview-toggle { display: none; }
        /*.uploader-preview-toggle {
            background: var(--panel-bg); border: 1px solid var(--border); color: #fff; border-radius: 8px;
            width: 2.5rem; cursor: pointer; font-size: 16px; display: none; align-items: center;
            justify-content: center; user-select: none;
        }*/
        .uploader-preview-toggle:hover { background-color: var(--border); }
        .uploader-preview-box {
            margin-top: 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
            overflow: hidden; display: flex; justify-content: center; align-items: center; max-height: 200px;
            transition: max-height 0.2s ease-out;
        }
        .uploader-preview-box.collapsed { max-height: 0; margin-top: 0; border: none; }
        .uploader-preview-box img, .uploader-preview-box video { max-width: 100%; max-height: 200px; object-fit: contain; }
        .uploader-preview-box audio { width: 100%; padding: 8px; }

        .bottom-action-bar {
            position: absolute; bottom: 0; left: 0; width: 100%; background-color: var(--bg); z-index: 100; display: flex;
            flex-direction: column; padding-bottom: env(safe-area-inset-bottom); border-top-left-radius: 24px; border-top-right-radius: 24px;
            box-shadow: 0px 0px 30px var(--shadow); border-top: 1px solid var(--border); 
        }
        
        .button-group { display: flex; gap: 10px; padding: 8px 16px 10px 16px; }
        .btn {
            flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 14px; height: 40px;
            font-weight: bold; color: white; cursor: pointer; display: flex; justify-content: center;
            align-items: center; transition: background-color 0.2s, box-shadow 0.2s, transform 0.1s;
        }
        .btn:active { opacity: 0.8; transform: scale(0.98); }
        
        .btn-run-wrapper { position: relative; flex: 3; display: flex; }
        .btn-run { width: 100%; background-color: #3E8AE2; }
        .btn-run:hover { filter: brightness(1.2); }
        .queue-badge {
            display: none; position: absolute; top: -6px; left: -6px; font-size: 13px; font-weight: bold;
            background-color: #F44336 !important; color: #FFFFFF !important; height: 26px; min-width: 26px;
            padding: 0 5px; border-radius: 13px; border: 2px solid var(--bg); align-items: center; 
            justify-content: center; z-index: 10; pointer-events: none; 
        }
        
        .btn-stop { background-color: var(--red); flex: 1; }
        .btn-stop:hover { filter: brightness(1.2); }

        .modal {
            display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8); justify-content: center; align-items: center; padding: 16px;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
        }
        .modal-content {
            background-color: var(--panel-bg); border: 1px solid var(--border); border-radius: 12px;
            width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 12px; padding: 16px;

    <script>
        function isMobile() {
            const ua = navigator.userAgent;
            if (/Android|iPhone|iPod/i.test(ua)) return true;
            if (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) return true;
            return false;
        }
        
        // 🛡️ 全局网页防双指张开缩放金钟罩 (仅对灯箱大图 #lightbox-img 白名单放行)
        function initGlobalAntiPinchGuard() {
            // A. 拦截 iOS Safari 专属的 Safari 网页缩放手势
            document.addEventListener('gesturestart', (e) => {
                if (e.target.id !== 'lightbox-img') e.preventDefault();
            });
            document.addEventListener('gesturechange', (e) => {
                if (e.target.id !== 'lightbox-img') e.preventDefault();
            });
            document.addEventListener('gestureend', (e) => {
                if (e.target.id !== 'lightbox-img') e.preventDefault();
            });
            
            // B. 拦截所有移动端浏览器的多指 (双指/三指) 网页拉伸放缩
            document.addEventListener('touchstart', (e) => {
                if (e.touches.length > 1 && e.target.id !== 'lightbox-img') {
                    if (e.cancelable) e.preventDefault();
                }
            }, { passive: false });
            
            document.addEventListener('touchmove', (e) => {
                if (e.touches.length > 1 && e.target.id !== 'lightbox-img') {
                    if (e.cancelable) e.preventDefault();
                }
            }, { passive: false });
        }
        
        // 启动金钟罩
        initGlobalAntiPinchGuard();
        
        const getSystemTheme = () => {
            const topWin = window.top || window;
            return topWin.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        };
        
        const themeButtonText = (theme) => {
            const btn = document.getElementById("theme-toggle");
            if (btn) {
                if (theme === 'system') btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-dot-icon lucide-circle-dot"><path d="M 12 2 A 10 10 0 0 0 12 22 Z" fill="currentColor"/><circle cx="12" cy="12" r="10"/></svg>';
                else if (theme === 'light') btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun-icon lucide-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>';
                else btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-moon-icon lucide-moon"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>';
            }
        }
        
        const applyTheme = (theme) => {
            let activeTheme = theme;
            if (theme === 'system') activeTheme = getSystemTheme();
            if (activeTheme === 'light') {
                document.documentElement.classList.add('light-theme');
                document.documentElement.classList.remove('dark-theme');
            } else {
                document.documentElement.classList.add('dark-theme');
                document.documentElement.classList.remove('light-theme');
            }
            themeButtonText(theme);
        };
        
        const savedTheme = localStorage.getItem('appview_theme') || 'system';
        applyTheme(savedTheme);
        
        const topWin = window.top || window;
        topWin.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            const currentTheme = localStorage.getItem('appview_theme') || 'system';
            if (currentTheme === 'system') { applyTheme('system'); }
        });
        
        if (window.self !== window.top && window.parent.FastLoadImageBridge) {
            window.fetch = async function(input, init) {
                let urlStr = typeof input === 'string' ? input : (input instanceof Request ? input.url : null);
                if (urlStr && (urlStr.includes('/view') || urlStr.includes('/api/view'))) {
                    return await window.parent.FastLoadImageBridge.fetch(urlStr, init);
                }
                return window.parent.fetch.apply(window, arguments);
            };
            const originalSetSrc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src').set;
            Object.defineProperty(HTMLImageElement.prototype, 'src', {
                set(val) {
                    if (val && (val.includes('/view') || val.includes('/api/view'))) {
                        window.parent.FastLoadImageBridge.getObjectUrl(val).then(objectUrl => {
                            originalSetSrc.call(this, objectUrl);
                        }).catch(() => {
                            originalSetSrc.call(this, val);
                        });
                        return;
                    }
                    originalSetSrc.call(this, val);
                }
            });
        }
    </script>

    <script>
        const standaloneParams = new URLSearchParams(window.location.search);
        const appFileName = standaloneParams.get('app');
        const isStandaloneMode = !!appFileName || standaloneParams.get('mode') === 'standalone';
        if (isStandaloneMode) {
            const splash = document.getElementById('splash-screen');
            const iconEl = splash.querySelector('.splash-icon');
            const titleEl = splash.querySelector('.splash-title');
            const subtitleEl = splash.querySelector('.splash-subtitle');
            iconEl.classList.add("loading");
            iconEl.innerText = "⏳";
            titleEl.innerText = "Loading Nodes & Models";
            setTimeout(() => {
                titleEl.innerText = "Still Loading...";
                subtitleEl.style.display = "block";
            }, 6000);
            setTimeout(() => {
                titleEl.innerText = "Loading Nodes & Models";
            },15000);
        }
    </script>
    <script type="text/javascript" src="./i18n/i18n.js"></script>
    <script>
        // ⚡ ====== 无头模式 (Standalone Mode) 专用引擎 ====== ⚡
        let standaloneClientId = "appview_standalone_" + Math.random().toString(36).substring(2, 9);
        let standaloneWorkflowData = null;
        let standaloneBuilderNode = null;
        let standaloneWs = null;
        let globalObjectInfo = null;
        
        async function fetchObjectInfo() {
            if (!globalObjectInfo) {
                try {
                    const res = await fetch(`/appbuilder/fast_object_info?app=${encodeURIComponent(appFileName)}`);
                    if (res.ok) globalObjectInfo = await res.json();
                } catch(e) { console.error("Failed to fetch object_info:", e); }
            }
            return globalObjectInfo;
        }

        // 🔒 100% 抓取页面所有 DOM 输入框的最新值（支持 TextArea, Slider, LoraStack, Select 等）
        function getAppViewFormValues() {
            const formValues = {};
            const elements = document.querySelectorAll('input, select, textarea');
            
            elements.forEach(el => {
                let key = null;
                if (el.id && el.id.startsWith('input_')) {
                    key = el.id.replace('input_', '');
                } else if (el.id && el.id.startsWith('lora-data_')) {
                    key = el.id.replace('lora-data_', '');
                }

                if (key) {
                    if (el.type === 'checkbox') {
                        formValues[key] = el.checked;
                    } else if (el.type === 'number' || el.type === 'range') {
                        formValues[key] = Number(el.value);
                    } else {
                        formValues[key] = el.value;
                    }
                }
            });

            return formValues;
        }

        // ⚡ 基于“下游槽位直接注入”原理的终极 API 转换引擎
        async function convertWorkflowToApiPrompt(workflowData, formValues) {
            const objectInfo = await fetchObjectInfo();
            const prompt = {};
            const linksMap = {};
            
            if (workflowData.links) {
                workflowData.links.forEach(link => {
                    // link: [link_id, origin_id, origin_slot, target_id, target_slot, type]
                    linksMap[link[0]] = [String(link[1]), link[2]];
                });
            }

            const nodesMap = {};
            workflowData.nodes.forEach(node => { nodesMap[String(node.id)] = node; });

            // 1. 读取面板配置，并按槽位顺序构建映射 (0号槽: prompt, 1号槽: seed...)
            const builderNode = workflowData.nodes.find(n => n.type === "AppBuilderAdv" || n.type === "AppBuilder");
            let config = {};
            if (builderNode) {
                const configStr = builderNode.widgets_values?.[0] || "{}";
                try { config = JSON.parse(configStr); } catch(e){}
            }

            const slotValuesMap = {};
            const uiEntries = Object.entries(config).filter(([k, p]) => p.type !== "BUTTON" && p.type !== "BYPASSER");

            uiEntries.forEach(([key, param], slotIdx) => {
                let val = formValues[key] !== undefined ? formValues[key] : param.value;
                if (val === undefined || val === null) val = param.default;

                // 未上传新图片时，保留工作流默认图片
                if (param.type === "UPLOADER" && (!val || val === "None")) val = null;

                if (val !== null && val !== undefined) {
                    if (param.type === "INT" || param.type === "SEED") val = Math.round(Number(val));
                    else if (param.type === "FLOAT") val = Number(val);
                    else if (param.type === "BOOLEAN") val = Boolean(val);
                }
                slotValuesMap[slotIdx] = val;
            });

            const uiNodeTypes = ["AppBuilder", "AppBuilderAdv", "ParametersUnpacker", "ParameterUnpacker", "AppBuilderBypasser"];

            // 2. 遍历真实节点，把 UI 参数直接注入到 downstream 槽位中
            workflowData.nodes.forEach(node => {
                const classType = node.type;
                if (!objectInfo[node.type] || uiNodeTypes.includes(classType)) return; // 过滤 UI 节点
                
                const nodePrompt = { 
                    class_type: classType, 
                    inputs: {},
                    _meta: { title: node.title || classType }
                };
                const nodeDef = objectInfo ? objectInfo[classType] : null;
                    
                // A. 先用节点的默认 Widget 控件值填充
                if (nodeDef && nodeDef.input) {
                    const reqInputs = nodeDef.input.required || {};
                    const optInputs = nodeDef.input.optional || {};
                    const allInputDefs = { ...reqInputs, ...optInputs };
                    
                    let widgetIdx = 0;
                    
                    const isWidgetSpec = (spec) => {
                        if (!spec || !Array.isArray(spec)) return false;
                        if (Array.isArray(spec[0])) return true;
                        const t = String(spec[0]).toUpperCase();
                        
                        // 增加对 COMFY_DYNAMICCOMBO_V3 等新版动态/复合控件的兼容识别
                        return ["INT", "FLOAT", "STRING", "BOOLEAN", "COMBO", "NUMBER"].includes(t) 
                        || t.includes("COMBO") 
                        || t.startsWith("COMFY_");
                    };
                        
                    const rawWidgetsValues = node.widgets_values;
                    const widgetValuesArray = Array.isArray(rawWidgetsValues) ? rawWidgetsValues : [];
                    const widgetValuesObj = (typeof rawWidgetsValues === "object" && !Array.isArray(rawWidgetsValues) && rawWidgetsValues !== null) ? rawWidgetsValues : {};
                    
                    for (const [inputName, inputSpec] of Object.entries(allInputDefs)) {
                        if (isWidgetSpec(inputSpec)) {
                            // 1. 提取预设默认值 (Default Value)
                            let defaultValue = undefined;
                            if (Array.isArray(inputSpec) && inputSpec[1] && typeof inputSpec[1] === "object") {
                                defaultValue = inputSpec[1].default;
                            } else if (Array.isArray(inputSpec[0])) {
                                defaultValue = inputSpec[0][0];
                            }
                            
                            // 2. 优先级：对象显式键值 -> 数组按序提取 -> object_info 默认值兜底
                            let val = undefined;
                            if (widgetValuesObj[inputName] !== undefined) {
                                val = widgetValuesObj[inputName];
                            } else if (widgetIdx < widgetValuesArray.length) {
                                val = widgetValuesArray[widgetIdx++];
                                if (typeof val === "string" && ["fixed", "increment", "decrement", "randomize"].includes(val)) {
                                    if (widgetIdx < widgetValuesArray.length) val = widgetValuesArray[widgetIdx++];
                                }
                            } else {
                                val = defaultValue; // 🌟 兜底保障：无论如何填入默认值！
                            }
                            
                            if (val !== undefined && val !== null) {
                                nodePrompt.inputs[inputName] = val;
                            }
                                
                            // 3. 处理 DynamicCombo 复合控件 (如 SaveImageAdvanced)
                            const typeStr = String(inputSpec[0]).toUpperCase();
                            if (typeStr.includes("DYNAMICCOMBO") || typeStr.includes("DYNAMIC_COMBO")) {
                                const comboOpts = inputSpec[1]?.options;
                                if (Array.isArray(comboOpts)) {
                                    const selKey = (typeof val === "object" && val !== null) ? (val.key || val.name || val.value) : val;
                                    const selectedOpt = comboOpts.find(o => o.key === selKey || o.name === selKey);
                                    
                                    if (selectedOpt && selectedOpt.inputs) {
                                        const subReq = selectedOpt.inputs.required || {};
                                        const subOpt = selectedOpt.inputs.optional || {};
                                        const allSubDefs = { ...subReq, ...subOpt };
                                        
                                        for (const [subName, subSpec] of Object.entries(allSubDefs)) {
                                            let subDefault = subSpec[1]?.default ?? (Array.isArray(subSpec[0]) ? subSpec[0][0] : undefined);
                                                let subVal = undefined;
                                                if (widgetValuesObj[`${inputName}.${subName}`] !== undefined) {
                                                    subVal = widgetValuesObj[`${inputName}.${subName}`];
                                                } else if (widgetIdx < widgetValuesArray.length) {
                                                    subVal = widgetValuesArray[widgetIdx++];
                                                } else {
                                                    subVal = subDefault;
                                                }
                                                if (subVal !== undefined && subVal !== null) {
                                                    nodePrompt.inputs[`${inputName}.${subName}`] = subVal;
                                                }
                                        }
                                    }
                                }
                            }
                                
                            // 4. 处理 VHS_VideoCombine 专属动态格式参数
                            if (inputSpec[1] && inputSpec[1].formats) {
                                const formatsObj = inputSpec[1].formats;
                                const formatKey = (typeof val === "object" && val !== null) ? (val.key || val.name || val.value) : val;
                                
                                if (formatKey && formatsObj[formatKey]) {
                                    const subWidgetDefs = formatsObj[formatKey];
                                    if (Array.isArray(subWidgetDefs)) {
                                        for (const subItem of subWidgetDefs) {
                                            if (Array.isArray(subItem) && subItem.length > 0) {
                                                const subName = subItem[0];
                                                let subDefault = subItem[2]?.default ?? (Array.isArray(subItem[1]) ? subItem[1][0] : undefined);
                                                    let subVal = undefined;
                                                    
                                                    if (widgetValuesObj[subName] !== undefined) {
                                                        subVal = widgetValuesObj[subName];
                                                    } else if (widgetIdx < widgetValuesArray.length) {
                                                        subVal = widgetValuesArray[widgetIdx++];
                                                    } else {
                                                        subVal = subDefault;
                                                    }
                                                    
                                                    if (subVal !== undefined && subVal !== null) {
                                                        nodePrompt.inputs[subName] = subVal;
                                                    }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    } // 闭合 for (inputName)
                } // 🌟 补上了这里缺失的右大括号，闭合 if (nodeDef && nodeDef.input) !
                    
                    // B. 处理槽位连线：如果是 UI 节点的线，直接用 slotValuesMap 注入！如果是普通节点，保持 ["4", 0]
                if (node.inputs) {
                    node.inputs.forEach(input => {
                        if (input.link) {
                            const originInfo = linksMap[input.link];
                            if (originInfo) {
                                const originNodeId = originInfo[0];
                                const originSlot = originInfo[1];
                                const originNode = nodesMap[originNodeId];
                                
                                if (originNode && uiNodeTypes.includes(originNode.type)) {

                        const nodePrefix = (nodesMap[targetNodeId]?.title || nodesMap[targetNodeId]?.type || "").replace(/[^a-zA-Z0-9_]/g, "_");

        // ⚡ 归一化 WebSocket 引擎：完美适配原生数据格式，解决卡生成中与走字图
        function initStandaloneWebSocket() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            standaloneWs = new WebSocket(`${protocol}//${location.host}/ws?clientId=${standaloneClientId}`);
            standaloneWs.binaryType = "arraybuffer";

            standaloneWs.onmessage = (event) => {
                if (event.data instanceof ArrayBuffer) {
                    const view = new DataView(event.data);
                    const eventType = view.getUint32(0);
                    if (eventType === 1) {
                        const imageType = view.getUint32(4);
                        const mimeType = imageType === 1 ? "image/png" : "image/jpeg";
                        const imageBlob = new Blob([event.data.slice(8)], { type: mimeType });
                        window.postMessage({ type: 'b_preview', blob: imageBlob }, '*');
                    }
                } 
                else {
                    try {
                        const msg = JSON.parse(event.data);
                        let detail = msg.data;
                        if (msg.type === "status" && detail && detail.status) detail = detail.status;
                        window.postMessage({ type: msg.type, detail: detail }, '*');
                    } catch(e){}
                }
            };

            standaloneWs.onclose = () => { setTimeout(initStandaloneWebSocket, 2000); };
        }

        function addRawTerminalLog(lineText) {

            if (!cleanText) return;
            if (cleanText.includes('[WinError 10054]')) return;
            if (isProgress && lastTerminalLineEl && lastTerminalLineEl.parentNode === content) {
                lastTerminalLineEl.innerHTML = cleanText;

                const lineEl = document.createElement('div');
                let typeClass = 'white';
                if (cleanText.includes('[ERROR]') || cleanText.includes('Exception') || cleanText.includes('FAILED')) { typeClass = 'error'; } 
                else if (cleanText.includes('[WARNING]')) { typeClass = 'warning'; } 
                else if (cleanText.includes('Prompt executed') || cleanText.includes('executed in') || cleanText.includes('[INFO] Prompt executed')) { typeClass = 'green'; } 
                else if (cleanText.includes('got prompt') || cleanText.includes('[INFO] got prompt') || isProgress) { typeClass = 'white'; }
                lineEl.className = `log-line ${typeClass}`;
                lineEl.innerHTML = cleanText;
                content.appendChild(lineEl);
                if (isProgress) { lastTerminalLineEl = lineEl; } else { lastTerminalLineEl = null; }
            }

            while (content.childNodes.length > 420) { content.removeChild(content.firstChild); }
        }
        function createNumericInput(options = {}) {
            const type = (options.type || "INT").toUpperCase();
            const minVal = options.min !== undefined ? Number(options.min) : -Infinity;
            const maxVal = options.max !== undefined ? Number(options.max) : Infinity;
            const step = options.step !== undefined ? Number(options.step) : (type === "INT" ? 1 : 0.1);
            const precision = options.precision !== undefined ? Number(options.precision) : (type === "FLOAT" ? 3 : 0);
            const initialVal = options.value ?? 0;
            
            const wrapper = document.createElement('div');
            wrapper.className = 'numeric-input-wrapper';
            
            const btnMinus = document.createElement('button');
            btnMinus.type = 'button';
            btnMinus.className = 'btn-numeric-adjust btn-numeric-adjust-left';
            btnMinus.innerText = '◀';
            
            const input = document.createElement('input');
            input.type = 'number';
            input.className = 'number-input';
            if (options.id) input.id = options.id;
            if (options.min !== undefined) input.min = options.min;
            if (options.max !== undefined) input.max = options.max;
            
            input.step = type === "FLOAT" ? "any" : step;
            input.value = type === "FLOAT" 
            ? Number(initialVal).toFixed(precision) 
            : Math.round(Number(initialVal));
            
            const btnPlus = document.createElement('button');
            btnPlus.type = 'button';
            btnPlus.className = 'btn-numeric-adjust btn-numeric-adjust-right';
            btnPlus.innerText = '▶';
            
            // 🔒【核心修复】：防死循环锁
            let isUpdating = false;
            
            const applyValueChange = (rawVal, isFromNativeEvent = false) => {
                if (isUpdating) return; // 阻止死循环递归！
                isUpdating = true;
                
                let val = Number(rawVal);
                if (isNaN(val)) val = 0;
                if (val < minVal) val = minVal;
                if (val > maxVal) val = maxVal;
                
                const formatted = type === "FLOAT" ? val.toFixed(precision) : Math.round(val);
                const isTyping = (document.activeElement === input) && isFromNativeEvent;
                if (!isTyping || Number(rawVal) !== val) {
                    if (input.value !== formatted) {
                        input.value = formatted;
                    }
                }
                
                // 只有由 ◀ ▶ 按钮触发时才手动派发事件；如果是打字触发的原生事件则不再重复派发
                if (!isFromNativeEvent) {
                    input.dispatchEvent(new Event('change'));
                }
                
                if (typeof options.onChange === 'function') {
                    options.onChange(formatted);
                }
                
                isUpdating = false; // 解锁
            };
            
            // 事件绑定
            btnMinus.onclick = () => applyValueChange(Number(input.value) - step, false);
            btnPlus.onclick = () => applyValueChange(Number(input.value) + step, false);
            
            // 监听打字失焦事件，传入 isFromNativeEvent = true
            input.addEventListener('change', () => applyValueChange(input.value, true));
            
            // 组装 DOM
            wrapper.appendChild(btnMinus);
            wrapper.appendChild(input);
            wrapper.appendChild(btnPlus);
            
            return { wrapper, input };
        }
