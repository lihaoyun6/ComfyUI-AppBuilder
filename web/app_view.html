                        if (item.type.indexOf('image') !== -1 || item.type.indexOf('video') !== -1 || item.type.indexOf('audio') !== -1) {
                            const file = item.getAsFile();
                            if (file) {
                                cleanup();
                                onFileObtained(file);
                                return;
                            }
                        }
                    }
                }
            };
                
            document.addEventListener('paste', handlePaste);
            
            setTimeout(() => {
                editable.focus();
                if (isMobileDevice) {
                    const range = document.createRange();
                    range.selectNodeContents(editable);
                    const sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(range);
                }
            }, 100);
        }
        
        document.getElementById('btn-stop').addEventListener('click', () => {
            fetch('/interrupt', { method: 'POST' }).catch(err => console.error("Interrupt failed:", err));
        });
        
        // 🖌️ ====== 遮罩编辑器 (Mask Editor) 核心引擎 ======
        let maskState = {
            currentValueInput: null,
            currentPreviewBox: null,
            currentFilename: '',
            bgImg: null,
            canvas: null,
            ctx: null,
            cursor: null,
            isDrawing: false,
            mode: 'draw', // 'draw' 或 'erase'
            brushSize: 40,
            historyStack: [], // Undo 栈
            redoStack: [],    // Redo 栈
            maxHistory: 20
        };
        
        function initMaskModalEvents() {
            const modal = document.getElementById('mask-modal');
            const closeBtn = document.getElementById('mask-modal-close');
            const cancelBtn = document.getElementById('mask-btn-cancel');
            const saveBtn = document.getElementById('mask-btn-save');
            const undoBtn = document.getElementById('mask-btn-undo');
            const redoBtn = document.getElementById('mask-btn-redo');
            const drawBtn = document.getElementById('mask-btn-draw');
            const eraseBtn = document.getElementById('mask-btn-erase');
            const invertBtn = document.getElementById('mask-btn-invert');
            const clearBtn = document.getElementById('mask-btn-clear');
            const sizeSlider = document.getElementById('mask-brush-size');
            
            const closeModal = () => { modal.style.display = 'none'; };
            closeBtn.onclick = closeModal;
            cancelBtn.onclick = closeModal;
            
            // 模式切换
            drawBtn.onclick = () => {
                maskState.mode = 'draw';
                drawBtn.classList.add('active');
                eraseBtn.classList.remove('active');
            };
            eraseBtn.onclick = () => {
                maskState.mode = 'erase';
                eraseBtn.classList.add('active');
                drawBtn.classList.remove('active');
            };
            if (invertBtn) invertBtn.onclick = invertMask;
            // 笔刷大小
            sizeSlider.oninput = (e) => {
                maskState.brushSize = parseInt(e.target.value);
                document.getElementById('mask-brush-size-val').innerText = `${maskState.brushSize}px`;
                updateCursorSize();
            };
            
            // Undo / Redo
            undoBtn.onclick = undoMask;
            redoBtn.onclick = redoMask;
            
            // 清空
            clearBtn.onclick = () => {
                saveMaskState();
                maskState.ctx.clearRect(0, 0, maskState.canvas.width, maskState.canvas.height);
            };
            
            // 保存应用
            saveBtn.onclick = applyAndUploadMask;
            
            // 快捷键支持 (Ctrl+Z, Ctrl+Y)
            window.addEventListener('keydown', (e) => {
                if (modal.style.display !== 'flex') return;
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                    if (e.shiftKey) redoMask(); else undoMask();
                } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
                    redoMask();
                }
            });
        }
            
        function updateCursorSize() {
            if (!maskState.cursor || !maskState.bgImg) return;
            const rect = maskState.bgImg.getBoundingClientRect();
            if (!rect.width || rect.width === 0) return; // 👈 避免 DOM 未渲染完成时算成 0
            const scale = rect.width / (maskState.bgImg.naturalWidth || 1);
            const displaySize = maskState.brushSize * scale;
            maskState.cursor.style.width = `${displaySize}px`;
            maskState.cursor.style.height = `${displaySize}px`;
        }
        
        function saveMaskState() {
            if (!maskState.ctx) return;
            const snapshot = maskState.ctx.getImageData(0, 0, maskState.canvas.width, maskState.canvas.height);
            maskState.historyStack.push(snapshot);
            if (maskState.historyStack.length > maskState.maxHistory) maskState.historyStack.shift();
            maskState.redoStack = []; // 开启新绘制时清空 Redo
            updateUndoRedoButtons();
        }
        
        function updateUndoRedoButtons() {
            document.getElementById('mask-btn-undo').disabled = maskState.historyStack.length === 0;
            document.getElementById('mask-btn-redo').disabled = maskState.redoStack.length === 0;
        }
        
        function undoMask() {
            if (maskState.historyStack.length === 0) return;
            const current = maskState.ctx.getImageData(0, 0, maskState.canvas.width, maskState.canvas.height);
            maskState.redoStack.push(current);
            const prev = maskState.historyStack.pop();
            maskState.ctx.putImageData(prev, 0, 0);
            updateUndoRedoButtons();
        }
        
        function redoMask() {
            if (maskState.redoStack.length === 0) return;
            const current = maskState.ctx.getImageData(0, 0, maskState.canvas.width, maskState.canvas.height);
            maskState.historyStack.push(current);
            const next = maskState.redoStack.pop();
            maskState.ctx.putImageData(next, 0, 0);
            updateUndoRedoButtons();
        }
            
        function invertMask() {
            if (!maskState.ctx || !maskState.canvas) return;
            saveMaskState();
            
            const nw = maskState.canvas.width;
            const nh = maskState.canvas.height;
            const imgData = maskState.ctx.getImageData(0, 0, nw, nh);
            const data = imgData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                if (data[i + 3] > 0) {
                    data[i] = 0; data[i + 1] = 0; data[i + 2] = 0; data[i + 3] = 0;
                } else {
                    data[i] = 255; data[i + 1] = 0; data[i + 2] = 0; data[i + 3] = 255;
                }
            }
            maskState.ctx.putImageData(imgData, 0, 0);
        }
            
        function openMaskEditor(filename, valueInputEl, previewBoxEl) {
            if (!filename || filename === 'None') return;
            maskState.currentValueInput = valueInputEl;
            maskState.currentPreviewBox = previewBoxEl;
            maskState.currentFilename = filename;
            maskState.historyStack = [];
            maskState.redoStack = [];
            updateUndoRedoButtons();
            
            if (!valueInputEl._originalUnmaskedFilename) valueInputEl._originalUnmaskedFilename = filename;
            // 👈 修复问题 2：背景永远载入原始无透孔图片
            const displayFilename = valueInputEl._originalUnmaskedFilename; 
            
            const modal = document.getElementById('mask-modal');
            const bgImg = document.getElementById('mask-bg-img');
            const canvas = document.getElementById('mask-draw-canvas');
            const cursor = document.getElementById('mask-brush-cursor');
            
            maskState.bgImg = bgImg;
            maskState.canvas = canvas;
            maskState.ctx = canvas.getContext('2d');
            maskState.cursor = cursor;
            canvas.style.opacity = '0.4';
            
            bgImg.onload = () => {
                const nw = bgImg.naturalWidth;
                const nh = bgImg.naturalHeight;
                canvas.width = nw;
                canvas.height = nh;
                maskState.ctx.clearRect(0, 0, nw, nh);
                
                // 如果 DOM 节点上有缓存的 Mask 画布，恢复它
                if (valueInputEl._cachedMaskCanvas) {
                    maskState.ctx.drawImage(valueInputEl._cachedMaskCanvas, 0, 0);
                }
                
                initCanvasEvents();
                updateCursorSize();
                modal.style.display = 'flex';
                
                // 同步滑块初始值 UI
                const sizeSlider = document.getElementById('mask-brush-size');
                if (sizeSlider) {
                    sizeSlider.value = maskState.brushSize;
                    document.getElementById('mask-brush-size-val').innerText = `${maskState.brushSize}px`;
                }
                
                // 🌟 等待 DOM Layout 渲染完成后，精准刷新光标圈尺寸
                requestAnimationFrame(() => {
                    setTimeout(() => { updateCursorSize(); }, 50);
                });
            };
            
            bgImg.src = `/api/view?filename=${encodeURIComponent(displayFilename)}&type=input`;
        }
            
        function initCanvasEvents() {
            const canvas = maskState.canvas;
            const bgImg = maskState.bgImg;
            const cursor = maskState.cursor;
            
            // 存储上一次画笔的物理坐标
            let lastX = null;
            let lastY = null;
                
            const getCanvasCoords = (e) => {
                const rect = bgImg.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY,
                    clientX: clientX - rect.left,
                    clientY: clientY - rect.top
                };
            };
            
            // 执行单段线段绘制/插值
            const drawSegment = (x1, y1, x2, y2) => {
                const ctx = maskState.ctx;
                ctx.lineWidth = maskState.brushSize;
                ctx.lineCap = 'round';   // 线的两端为圆头
                ctx.lineJoin = 'round';  // 线段拐角处圆滑过渡
                
                if (maskState.mode === 'draw') {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = '#ff0000'; // 纯红绘制，重叠不会变深
                    ctx.fillStyle = '#ff0000';
                } else {
                    ctx.globalCompositeOperation = 'destination-out'; // 橡皮擦模式
                }
                
                ctx.beginPath();
                if (x1 === x2 && y1 === y2) {
                    // 点按一下（未发生划动）
                    ctx.arc(x1, y1, maskState.brushSize / 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // 划动过程：连接上一点与当前点，消除离散断点
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }
            };
                
            const startDraw = (e) => {
                e.preventDefault();
                saveMaskState();
                maskState.isDrawing = true;
                const pos = getCanvasCoords(e);
                lastX = pos.x;
                lastY = pos.y;
                drawSegment(pos.x, pos.y, pos.x, pos.y);
            };
            
            const moveDraw = (e) => {
                const pos = getCanvasCoords(e);
                
                // 更新并显示画笔圆圈 Cursor
                updateCursorSize(); // 👈 确保尺寸是最新的
                cursor.style.display = 'block';
                cursor.style.left = `${pos.clientX}px`;
                cursor.style.top = `${pos.clientY}px`;
                
                if (!maskState.isDrawing) return;
                e.preventDefault();
                
                // 🌟 获取高频触摸点 (Coalesced Events)，处理快速划动时的丢失点
                const coalesced = (e.getCoalescedEvents && e.getCoalescedEvents()) || [e];
                for (const ev of coalesced) {
                    const currentPos = getCanvasCoords(ev);
                    drawSegment(lastX, lastY, currentPos.x, currentPos.y);
                    lastX = currentPos.x;
                    lastY = currentPos.y;
                }
            };
                
            const stopDraw = () => {
                if (maskState.isDrawing) {
                    maskState.isDrawing = false;
                    lastX = null;
                    lastY = null;
                }
            };
            
            canvas.onpointerdown = startDraw;
            canvas.onpointermove = moveDraw;
            canvas.onpointerup = stopDraw;
            canvas.onpointerleave = () => {
                stopDraw();
                cursor.style.display = 'none';
            };
            bgImg.parentElement.onpointerenter = () => { cursor.style.display = 'block'; };
            bgImg.parentElement.onpointerleave = () => { cursor.style.display = 'none'; };
        }
        
        async function applyAndUploadMask() {
            const saveBtn = document.getElementById('mask-btn-save');
            saveBtn.innerText = t('label_uploading', 'Uploading...');
            saveBtn.disabled = true;
                
            try {
                const nw = maskState.bgImg.naturalWidth;
                const nh = maskState.bgImg.naturalHeight;
                
                // 1. 检查如果 Mask 画板全空，直接还原为原图，无需提交 Mask
                const maskPixelData = maskState.ctx.getImageData(0, 0, nw, nh).data;
                let isMaskEmpty = true;
                for (let i = 3; i < maskPixelData.length; i += 4) {
                    if (maskPixelData[i] > 0) { isMaskEmpty = false; break; }
                }
                
                const originalName = maskState.currentValueInput._originalUnmaskedFilename || maskState.currentFilename;
                
                if (isMaskEmpty) {
                    maskState.currentValueInput.value = originalName;
                    maskState.currentValueInput._cachedMaskCanvas = null;
                    maskState.currentValueInput.dispatchEvent(new Event('change'));
                    
                    const img = maskState.currentPreviewBox.querySelector('img');
                    if (img) img.src = `/api/view?filename=${encodeURIComponent(originalName)}&type=input&t=${Date.now()}`;
                    
                    saveBtn.innerText = t('label_save', "Save")
                    saveBtn.disabled = false;
                    document.getElementById('mask-modal').style.display = 'none';
                    return;
                }
                
                // 2. 缓存当前 Mask 画布供二次编辑
                const cacheCanvas = document.createElement('canvas');
                cacheCanvas.width = nw; cacheCanvas.height = nh;
                cacheCanvas.getContext('2d').drawImage(maskState.canvas, 0, 0);
                maskState.currentValueInput._cachedMaskCanvas = cacheCanvas;
                
                // 🌟 3. 反转 Mask Alpha 通道，适配 ComfyUI (未涂鸦=不透明255，涂鸦=透明0)
                const invCanvas = document.createElement('canvas');
                invCanvas.width = nw; invCanvas.height = nh;
                const invCtx = invCanvas.getContext('2d');
                invCtx.fillStyle = '#FFFFFF';
                invCtx.fillRect(0, 0, nw, nh); // 填充纯白 (Alpha=255)
                invCtx.globalCompositeOperation = 'destination-out';
                invCtx.drawImage(maskState.canvas, 0, 0); // 扣掉涂鸦区域 (Alpha=0)
                
                // 4. 将反转后的正确 Alpha Mask 提交给 ComfyUI /upload/mask 接口
                invCanvas.toBlob(async (maskBlob) => {
                    const formData = new FormData();
                    formData.append('image', maskBlob, 'mask.png');
                    formData.append('original_ref', JSON.stringify({
                        filename: originalName,
                        subfolder: '',
                        type: 'input'
                    }));
                    
                    const res = await fetch('/upload/mask', { method: 'POST', body: formData });
                    if (res.ok) {
                        const result = await res.json();
                        maskState.currentValueInput.value = result.name;
                        maskState.currentValueInput.dispatchEvent(new Event('change'));
                        
                        // 刷新前端预览图
                        const img = maskState.currentPreviewBox.querySelector('img');
                        if (img) img.src = `/api/view?filename=${encodeURIComponent(result.name)}&type=input&t=${Date.now()}`;
                    } else {
                        alert("Failed to save mask via /upload/mask");
                    }
                    
                    saveBtn.innerText = t('label_save', "Save");
                    saveBtn.disabled = false;
                    document.getElementById('mask-modal').style.display = 'none';
                }, 'image/png');
            } catch (err) {
                console.error("Failed to apply mask:", err);
                saveBtn.innerText = t('label_save', "Save")
                saveBtn.disabled = false;
            }
        }
        
        // 初始化 Mask Modal 事件
        initMaskModalEvents();
        
        // 📊 ====== 监控面板数据与交互逻辑 ======
        let systemMonitorTimer = null;
        
        function formatBytesToGB(bytes) {
            if (!bytes || bytes === 0) return "0 GB";
            return (bytes / (1024 * 1024 * 1024)).toFixed(1) + " GB";
        }
        
        async function fetchAndUpdateSystemMonitor() {
            try {
                const res = await fetch('/appbuilder/system_stats');
                if (!res.ok) return;
                const data = await res.json();
                
                // 1. 第一行：RAM 渲染
                const ramTotal = data.system.ram_total || 0;
                const ramUsed = data.system.ram_used || 0;
                const ramPct = Number(data.system.ram_utilization || 0);
                
                document.getElementById('mon-ram-text').innerText = `${formatBytesToGB(ramUsed)}/${formatBytesToGB(ramTotal)} ${ramPct.toFixed(1)}%`;
                const ramBar = document.getElementById('mon-ram-bar');
                ramBar.style.width = `${ramPct}%`;
                ramBar.className = `monitor-bar-fill ${ramPct > 85 ? 'danger' : (ramPct > 70 ? 'warn' : '')}`;
                
                // 2. 第二行起：NVIDIA GPU 核心用量与 VRAM 渲染
                const gpuContainer = document.getElementById('gpu-monitor-container');
                gpuContainer.innerHTML = '';
                
                if (data.devices && data.devices.length > 0) {
                    data.devices.forEach((dev, idx) => {
                        const gpuCorePct = Number(dev.gpu_utilization || 0);
                        const vramTotal = dev.vram_total || 0;
                        const vramUsed = dev.vram_used || 0;
                        const vramPct = Number(dev.vram_utilization || 0);
                        let devName = dev.name || `GPU ${idx}`;
                        if (devName.includes("cuda:")) {
                            devName = devName.match(/cuda:\d+\s+(.*?)\s*:/)?.[1];
                        }
                        
                        const gpuRow = document.createElement('div');
                        gpuRow.className = 'monitor-row';
                        gpuRow.innerHTML = `
                        <div class="monitor-item">
                            <div class="monitor-label"><span>${devName}</span><span>${gpuCorePct.toFixed(1)}%</span></div>
                            <div class="monitor-bar-track"><div class="monitor-bar-fill ${gpuCorePct > 85 ? 'danger' : (gpuCorePct > 70 ? 'warn' : '')}" style="width: ${gpuCorePct}%;"></div></div>
                        </div>
                        <div class="monitor-item">
                            <div class="monitor-label"><span>VRAM</span><span>${formatBytesToGB(vramUsed)}/${formatBytesToGB(vramTotal)} ${vramPct.toFixed(1)}%</span></div>
                            <div class="monitor-bar-track"><div class="monitor-bar-fill ${vramPct > 85 ? 'danger' : (vramPct > 70 ? 'warn' : '')}" style="width: ${vramPct}%;"></div></div>
                        </div>
                    `;
                        gpuContainer.appendChild(gpuRow);
                    });
                }
            } catch (err) {
                console.error("Fetch system stats failed:", err);
            }
        }
        
        // 绑定按钮开关
        const monitorBtn = document.getElementById('monitor-toggle-btn');
        const monitorPanel = document.getElementById('system-monitor-panel');
        
        if (monitorBtn && monitorPanel) {
            monitorBtn.onclick = (e) => {
                e.stopPropagation();
                const isCollapsed = monitorPanel.classList.contains('collapsed');
                if (isCollapsed) {
                    monitorPanel.classList.remove('collapsed');
                    monitorBtn.classList.add('active');
                    fetchAndUpdateSystemMonitor();
                    if (!systemMonitorTimer) {
                        systemMonitorTimer = setInterval(fetchAndUpdateSystemMonitor, 1500);
                    }
                } else {
                    monitorPanel.classList.add('collapsed');
                    monitorBtn.classList.remove('active');
                    if (systemMonitorTimer) {
                        clearInterval(systemMonitorTimer);
                        systemMonitorTimer = null;
                    }
                }
            };
        }
    </script>
</body>
</html>
